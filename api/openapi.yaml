openapi: 3.1.0
info:
  title: MakonBook API
  version: 0.1.0
  description: |
    Backend for the MakonBook mobile app and admin panel. This file is the
    contract between this repo, the Expo app and the admin web app (spec 14.3).

    Every error response uses the `Error` envelope; clients branch on
    `error.code`, never on `error.message`. Every response carries an
    `X-Request-ID` header — quote it when reporting a problem.

    Authentication: `POST /v1/auth/login` returns a bearer token; send it as
    `Authorization: Bearer <token>`. While `must_change_password` is true
    (the person still uses the default password, the last 4 digits of their
    phone) only `/v1/me`, `/v1/auth/password` and `/v1/auth/logout` work;
    everything else answers 403 `password_change_required`. Any 401 means the
    session is gone (logout, password changed elsewhere, person no longer
    active): send the user back to the login screen.

    Accounts (spec 21): besides HolliHop's students and teachers, anyone can
    sign in or sign up as a student (`status: registered`) with an email code
    (`/v1/auth/email/*`, `/v1/auth/signup`), Google (`/v1/auth/google/*`) or
    Telegram (`/v1/auth/telegram/*`, which can share a verified phone). A
    registered student without a phone (`phone: null`) gets `403
    phone_required` from the content (practice and vocabulary) until they add
    one (`/v1/me/phone/*`); proving a number someone else has merges the two
    accounts. Verifying the code says whose the number already
    is: a SAT MAKON student's or teacher's (sign-up then signs into that
    account), or a registered student's (sign-up is refused). `/v1/app/config` says which of these the server
    offers. Registered students see the practice tests marked open to all
    (DAY1–DAY10); the others are `enrolled_only` until they enrol at SAT
    MAKON, when their account becomes the HolliHop student's.

    Roadmaps (spec 22): SAT MAKON's curriculum as a route of units and
    lessons per course (`math-foundation` … `english-advanced`), from the
    student's groups or, for registered students, from onboarding
    (`/v1/me/onboarding`; `onboarded` on the profile). Each lesson has a
    level check and homework, drawn from the bank and graded on the server
    (`/v1/me/roadmaps/*`, `/v1/me/assessments/*`).

    Assignments (spec 23): teachers give their groups homework, level checks
    and exams with deadlines (`/v1/teacher/assignments*`); students see and
    start theirs (`/v1/me/assignments*`), homework and level checks as
    assessments, exams as the mock test itself. New assignments show up in
    the in-app notifications (`/v1/me/notifications`).

    Admin panel (`/v1/admin/*`): admins sign in with their HolliHop login and
    password, which HolliHop checks; MakonBook stores neither. The session is
    an HttpOnly `mb_admin` cookie (SameSite=Strict, 12 h). Every admin request
    that changes something — and the sign-in itself — must carry the
    `X-MakonBook-Admin` header (any value); without it the answer is 403
    `forbidden`. Branch admins only ever see their own branches' data.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      summary: Liveness check
      description: Returns 200 while the process is running. Does not check dependencies.
      operationId: getHealth
      tags: [system]
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      summary: Readiness check
      description: Returns 200 when the service can reach its database, 503 otherwise.
      operationId: getReady
      tags: [system]
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          $ref: "#/components/responses/Error"

  /v1/app/config:
    get:
      summary: Public app configuration
      description: |
        Called by the app on startup, without authentication. If the app's
        version is older than `min_app_version` for its platform, the app
        shows an "update the app" screen and stops (spec D15).
      operationId: getAppConfig
      tags: [system]
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "500":
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      summary: Log in with phone number or username
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: "`invalid_credentials` — same answer whether the account exists or not"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            `account_locked` (5 wrong passwords in a row; 15 min, doubling
            with each further lockout, at most 24 h) or `rate_limited` (too
            many attempts from one network). `Retry-After` gives seconds.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/password:
    post:
      summary: Change password (including replacing the default one)
      description: Logs out every other session of this person.
      operationId: changePassword
      tags: [auth]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`wrong_password` — counts towards the lockout"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`weak_password` — the message says why (8–128 characters, not the old one, must not contain the phone number)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/auth/username:
    put:
      summary: Set an optional username to log in with
      operationId: setUsername
      tags: [auth]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Username" }
      responses:
        "200":
          description: Saved (lower-cased)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Username" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "`username_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_username`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/logout:
    post:
      summary: End this session
      operationId: logout
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/email/start:
    post:
      summary: Send a 6-digit code to an email (sign-in or sign-up)
      description: |
        The code is good for 10 minutes and 5 tries; only the address's latest
        code counts. Limits: per address one code a minute and 5 a day, per
        network 20 an hour (`429 rate_limited`, `Retry-After`). The address
        is trimmed and lower-cased.
      operationId: startEmailCode
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254, example: malika@example.com }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [resend_in, expires_in]
                properties:
                  resend_in: { type: integer, example: 60 }
                  expires_in: { type: integer, example: 600 }
        "400": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_email`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`rate_limited`"
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`email_unavailable`: email isn't configured, or sending failed (try again in a minute)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/email/verify:
    post:
      summary: Check the email code; signs in whoever has the address, or answers a sign-up ticket
      description: |
        An address someone active has signs them in (this is also the way
        back for a forgotten password). Otherwise the answer carries an
        `email_ticket` (single-use, 30 minutes) for `/v1/auth/signup`.
      operationId: verifyEmailCode
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, example: "123456" }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in, or new
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, token, expires_at, user]
                    properties:
                      status: { type: string, enum: [signed_in] }
                      token: { type: string }
                      expires_at: { type: string, format: date-time }
                      user: { $ref: "#/components/schemas/Profile" }
                  - type: object
                    required: [status, email_ticket]
                    properties:
                      status: { type: string, enum: [new] }
                      email_ticket: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "410":
          description: "`code_expired`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_code` (tries left in the message) or `invalid_email`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`too_many_tries` (`Retry-After`)"
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`email_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/signup:
    post:
      summary: Create a student account with a proved email
      description: |
        A registered student with the email, the names and the password, and
        no phone yet: the content answers `403 phone_required` until they add
        one (`/v1/me/phone/*`). Nothing is spent when a request is turned down.
      operationId: signup
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_ticket, first_name, last_name, password]
              properties:
                email_ticket: { type: string, description: "From `/v1/auth/email/verify` (`new`)" }
                first_name: { type: string, description: 1–60 characters after trimming }
                last_name: { type: string, description: 1–60 characters after trimming }
                password: { type: string, minLength: 8, maxLength: 128, description: The rules of `/v1/auth/password` }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: "`email_taken`: someone took the address meanwhile"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_ticket`, `weak_password`, `invalid_profile`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/phone/start:
    post:
      summary: Send a password-reset code by SMS
      description: |
        Only `purpose: reset` (adding a phone is `/v1/me/phone/start`). The
        answer is the same whether or not anyone signs in with the number; the
        code goes only to a number that has an account. 10 minutes, 5 tries;
        per phone one a minute and 5 a day, per network 20 an hour.
      operationId: startPhoneCode
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string, description: "An Uzbek number in any common format", maxLength: 50 }
                purpose: { type: string, enum: [reset] }
      responses:
        "200":
          description: Sent (also when no account has the number)
          content:
            application/json:
              schema:
                type: object
                required: [resend_in, expires_in]
                properties:
                  resend_in: { type: integer, example: 60 }
                  expires_in: { type: integer, example: 600 }
        "400": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_phone`: not a valid Uzbek (+998) number"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`rate_limited`"
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`sms_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/phone/verify:
    post:
      summary: Check the reset code; answers a ticket for /v1/auth/reset
      operationId: verifyPhoneCode
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { type: string, maxLength: 50 }
                code: { type: string, example: "123456", description: Spaces are ignored }
                purpose: { type: string, enum: [reset] }
      responses:
        "200":
          description: Verified; the ticket is single-use and good for 15 minutes
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "410":
          description: "`code_expired`: expired, used, never sent, or replaced by a newer one"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_code` (tries left in the message) or `invalid_phone`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`too_many_tries` (`Retry-After`)"
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`sms_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/reset:
    post:
      summary: Set a new password with a reset ticket, and sign in
      description: |
        For whoever signs in with the phone the ticket proves: sets the
        password, unlocks the account and ends every other session.
      operationId: resetPassword
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, password]
              properties:
                ticket: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404":
          description: "`no_account`: nobody signs in with this phone"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_ticket`, `weak_password`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/google/start:
    get:
      summary: Go to Google to sign in (a browser navigation, not a fetch)
      description: |
        Redirects to Google (scopes `openid email profile`, PKCE), with the
        sign-in's state in a short-lived HttpOnly cookie for the callback.
        Google sends the browser back to `/v1/auth/google/callback` on the
        web's origin (`WEB_ORIGIN`), which redirects to the web's
        `/auth/google` page.
      operationId: googleStart
      tags: [accounts]
      parameters:
        - name: return
          in: query
          description: A path on the web's origin to go back to afterwards (anything else becomes `/`)
          schema: { type: string, example: /practice }
      responses:
        "302": { description: To Google }
        "503":
          description: "`google_unavailable`: Google sign-in isn't configured"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/google/callback:
    get:
      summary: Where Google sends the browser back (not called by the web)
      description: |
        Checks the state against the cookie, trades the code at Google and
        reads the ID token (issuer, audience, expiry, a verified email). Then
        redirects to `WEB_ORIGIN/auth/google#ticket=<ticket>&return=<path>` —
        the ticket is single-use and good for 10 minutes, for
        `/v1/auth/google/ticket` — or `#error=google_denied` (cancelled at
        Google) or `#error=google_failed` (anything else).
      operationId: googleCallback
      tags: [accounts]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: To the web's /auth/google page }
        "503":
          description: "`google_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/google/ticket:
    post:
      summary: Finish Google sign-in with the callback's ticket
      description: |
        Always signs in: the Google account linked to someone active; else
        whoever active has its (verified) email, with Google linked to them;
        else a new registered student with no phone (names, the email, a copy
        of the photo, Google linked). A person may have several Google
        accounts.
      operationId: googleTicket
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_ticket`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/telegram/start:
    post:
      summary: Start Telegram sign-in (OpenID Connect); answers the address to send the browser to
      description: |
        `signin` needs no session; `verify` needs the bearer of a person
        without a phone (`409 phone_already_set` otherwise) and ties the flow
        to them. Scope `openid profile phone`, PKCE; the state and verifier
        stay on the server for 10 minutes. Telegram sends the browser back to
        `/v1/auth/telegram/callback` on `WEB_ORIGIN`.
      operationId: telegramStart
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [signin, verify] }
                return: { type: string, description: "A path on the web's origin to go back to (anything else becomes `/`)", example: /practice }
      responses:
        "200":
          description: The address at oauth.telegram.org
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "`phone_already_set` (verify)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`telegram_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/telegram/callback:
    get:
      summary: Where Telegram sends the browser back (not called by the web)
      description: |
        Trades the code at Telegram (client secret by Basic auth, PKCE
        verifier), checks the ID token (signature by Telegram's JWKS, RS256 or
        ES256; issuer, audience, expiry) and keeps its claims (the Telegram
        user id, names, username, photo, and the phone if shared) under a
        single-use ticket for 5 minutes. Then redirects to
        `WEB_ORIGIN/auth/telegram?ticket=<ticket>&purpose=signin|verify&return=<path>`,
        or `?error=telegram_denied` (declined) / `?error=telegram_failed`.
      operationId: telegramCallback
      tags: [accounts]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: To the web's /auth/telegram page }
        "503":
          description: "`telegram_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/auth/telegram/ticket:
    post:
      summary: Finish Telegram sign-in with a signin ticket
      description: |
        Always signs in: the Telegram account linked to someone active (the
        shared phone becomes theirs if they have none and nobody else has
        it); else whoever active has the shared phone (registered or
        enrolled, student or teacher), with Telegram linked if they have none;
        else a new registered student (names, the phone if shared, a copy of
        the photo, Telegram linked). `must_change_password` as at any login.
      operationId: telegramTicket
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_ticket`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`telegram_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/phone/start:
    post:
      summary: "Add a phone (no phone yet): send an SMS code"
      description: |
        For a registered student without a phone (`409 phone_already_set`
        for everyone else; enrolled people's phone comes from HolliHop). The
        rules and limits of `/v1/auth/phone/start`.
      operationId: startMyPhone
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, maxLength: 50 }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [resend_in]
                properties:
                  resend_in: { type: integer, example: 60 }
                  expires_in: { type: integer, example: 600 }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "`phone_already_set`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_phone`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`rate_limited`"
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`sms_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/phone/verify:
    post:
      summary: "Add a phone: check the SMS code"
      description: |
        Nobody else active has the number: it becomes theirs. Someone else
        active has it (registered or enrolled, student or teacher): proving
        the number is proof enough that it is the same person, so this
        account is merged into theirs in one transaction — Google accounts
        and the email (replacing theirs) move to them, the Telegram account
        too if they have none, the photo if they have none, and everything
        done (attempts, reviews, goals, parked questions, reports) moves to a
        student (or is deleted for a teacher); this account is removed and its
        sessions end. The answer is a new session for whoever has the phone
        afterwards (`must_change_password` as at any login).
      operationId: verifyMyPhone
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, maxLength: 50 }
                code: { type: string, example: "123456" }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in (as this person, or the one merged into)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "`phone_already_set`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "410":
          description: "`code_expired`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_code`, `invalid_phone`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`too_many_tries`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/phone/telegram:
    post:
      summary: Add the phone Telegram shared (a verify ticket)
      description: |
        The ticket from `/v1/auth/telegram/start` with `purpose: verify`,
        started by this same person. Applies the phone as
        `/v1/me/phone/verify` does, and links the Telegram account if it is
        free and the person who ends up with the phone has none.
      operationId: myPhoneTelegram
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in (as this person, or the one merged into)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "`phone_already_set`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_ticket` (unknown, used, expired, or someone else's), `telegram_no_phone` (Telegram didn't share one)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`telegram_unavailable`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/photo:
    put:
      summary: Set your own photo (the raw image as the body)
      description: |
        Everyone signed in (students and teachers, with or without a phone,
        even on the default password). JPEG, PNG or WebP, at most 512 KB;
        what the bytes are counts, not the header, and the image must decode
        (not necessarily square). It gets a new address (`photo_url`; old
        ones are cached forever); the previous photo is deleted. From then on
        Google's or Telegram's picture is never copied over it. 20 uploads an
        hour per person.
      operationId: setMyPhoto
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The profile, with the new photo_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "413":
          description: "`photo_too_large`: over 512 KB"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_photo`: not a JPEG, PNG or WebP image that decodes"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`rate_limited`"
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remove your photo
      description: The photo is deleted; Google's or Telegram's picture isn't copied again.
      operationId: removeMyPhoto
      tags: [accounts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The profile, with photo_url null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/photos/{id}:
    get:
      summary: A profile photo (no token; long cache)
      description: |
        The `photo_url` of a profile: one the person uploaded, or a copy of
        the Google or Telegram picture (JPEG, PNG or WebP, at most 512 KB),
        served from the API's origin so pages that load images from their own
        origin only can show it. A photo never changes (a new one gets a new
        id), hence the year-long immutable cache.
      operationId: photo
      tags: [accounts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: No such photo }

  /v1/me/profile:
    put:
      summary: Change your own name
      description: |
        The names the person sees for themselves from then on (in `/v1/me`
        and every sign-in); the HolliHop sync never changes them. Teachers,
        admins and parents keep seeing the names in HolliHop. null clears one,
        back to HolliHop's — only for people in HolliHop: a registered student
        needs both.
      operationId: saveProfile
      tags: [accounts]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: { type: [string, "null"], description: 1–60 characters after trimming }
                last_name: { type: [string, "null"], description: 1–60 characters after trimming }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_profile`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me:
    get:
      summary: The logged-in person, with their groups
      operationId: getMe
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/teacher/lessons:
    get:
      summary: The logged-in teacher's lessons on a date
      description: |
        Lessons come from the lesson days HolliHop lists for the teacher's
        groups (holidays and cancellations entered there are respected), for
        dates from 7 days ago to 14 days ahead. A teacher who isn't on a
        lesson's schedule item (e.g. a substitute) doesn't see it.
        `attendance_enabled` is false for one-to-one and online lessons,
        which don't take attendance in the app.
      operationId: getTeacherLessons
      tags: [attendance]
      security: [{ bearer: [] }]
      parameters:
        - name: date
          in: query
          description: Calendar date at the school; defaults to today there.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Lessons, earliest first
          content:
            application/json:
              schema:
                type: object
                required: [date, lessons]
                properties:
                  date: { type: string, format: date }
                  lessons:
                    type: array
                    items: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden` (not a teacher) or `password_change_required`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/attendance/sessions:
    post:
      summary: Start attendance for one of the teacher's lessons
      description: |
        Allowed from 15 minutes before the lesson until it ends, for lessons
        with `attendance_enabled`. The roster is frozen now: enrollments
        current that day and weekday, of active students. If the lesson
        already has a session (opened earlier, on this or another device, by
        any teacher of the lesson), that session is returned instead — any
        time, so reopening the app never loses it.
      operationId: openAttendance
      tags: [attendance]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: { type: integer }
                date: { type: string, format: date, description: Defaults to today at the school }
      responses:
        "200": { $ref: "#/components/responses/AttendanceSession" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found` — not one of this teacher's lessons on that date"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`too_early` (message says when it opens), `lesson_over`, `attendance_disabled` (one-to-one or online)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/attendance/sessions/{id}:
    get:
      summary: A session's live state (poll every few seconds while open)
      operationId: getAttendance
      tags: [attendance]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionID" }]
      responses:
        "200": { $ref: "#/components/responses/AttendanceSession" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/attendance/sessions/{id}/finish:
    post:
      summary: Finish attendance; everyone still pending becomes absent
      description: Idempotent. Sessions nobody finishes close on their own 15 minutes after the lesson ends.
      operationId: finishAttendance
      tags: [attendance]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionID" }]
      responses:
        "200": { $ref: "#/components/responses/AttendanceSession" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/attendance/sessions/{id}/marks/{client_id}:
    put:
      summary: Teacher's correction of one student's mark
      description: |
        Allowed while open and until 24 hours after the lesson ends, except
        for a mark the office already corrected in the admin panel (409
        `set_by_admin`). Every change is audited.
      operationId: setAttendanceMark
      tags: [attendance]
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionID" }
        - { name: client_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [present, late, absent] }
      responses:
        "200": { $ref: "#/components/responses/AttendanceSession" }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: "`edit_window_closed`, `not_in_roster`, `forbidden`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`set_by_admin` — the office corrected this mark; only they change it now"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/attendance:
    get:
      summary: The student's own attendance table
      description: |
        Lessons of the last 120 days, per group, newest first. Past lessons
        use HolliHop's marks (so admins' corrections count; a lesson nobody
        marked counts as attended there); the app adds `late`, and today's
        lessons come from the app until HolliHop has them. Synced from
        HolliHop every 15 minutes (last week) and nightly (whole window).
      operationId: getMyAttendance
      tags: [attendance]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema:
                type: object
                required: [from, to, groups]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  groups:
                    type: array
                    items:
                      type: object
                      required: [group_id, group_name, discipline, summary, days]
                      properties:
                        group_id: { type: integer }
                        group_name: { type: string }
                        discipline: { type: string }
                        summary:
                          type: object
                          required: [lessons, present, late, absent]
                          properties:
                            lessons: { type: integer }
                            present: { type: integer }
                            late: { type: integer }
                            absent: { type: integer }
                        days:
                          type: array
                          items:
                            type: object
                            required: [date, state]
                            properties:
                              date: { type: string, format: date }
                              state: { type: string, enum: [present, late, absent] }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden` — not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/attendance/scan:
    post:
      summary: A student checks in with the code from the teacher's QR
      description: |
        The QR carries `session_id`, `window` and `sig` (see `AttendanceQR`).
        Present if scanned up to 10 minutes after the lesson starts, late
        after that. Scanning again returns the existing mark with
        `already: true`. One phone can check in only one student per session.
      operationId: scanAttendance
      tags: [attendance]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, window, sig, device_id]
              properties:
                session_id: { type: string, format: uuid }
                window: { type: integer, format: int64 }
                sig: { type: string }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                type: object
                required: [state, already, group_name, at]
                properties:
                  state: { type: string, enum: [present, late] }
                  already: { type: boolean }
                  group_name: { type: string }
                  at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: "`not_in_roster`, `forbidden` (not a student)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`session_closed`, `device_already_used`, `marked_absent` (the teacher marked them absent)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_code` (not a MakonBook code, or forged), `code_expired` (scan the current one)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/practice/tests:
    get:
      summary: Every practice test, open or locked (students and teachers)
      description: |
        A test opens once every question in it is approved and the server has
        published it (within minutes); `version` is then its latest published
        version. A locked test has `version: null` and shows how far its
        review has come (`approved` of `questions`). A published test stays
        open at its last version while an edited question is reviewed again.
        A registered student (`status: registered`) sees the tests not open
        to all (all but DAY1–DAY10) locked too, with `enrolled_only: true`
        (and `bytes`, `published_at` null); for everyone else the field is
        left out. A registered student without a phone gets `403
        phone_required` here and from every practice and vocabulary endpoint
        (packages, attempts, statistics, Ask later, reports, goals, the deck,
        reviews) until they add one.
      operationId: practiceTests
      tags: [practice]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The catalog, in test order
          content:
            application/json:
              schema:
                type: object
                required: [tests]
                properties:
                  tests: { type: array, items: { $ref: "#/components/schemas/PracticeCatalogTest" } }
        "401": { $ref: "#/components/responses/Error" }

  /v1/practice/tests/{code}/package:
    get:
      summary: A published version of a test, to take offline
      description: |
        The package (questions, keys, explanations, score scales) and a link
        to each of its images, valid until `expires_at` (6 hours): download
        them right away. A version never changes once published; images are
        named by their bytes, so a file already on the device needn't be
        fetched again.
      operationId: practicePackage
      tags: [practice]
      security: [{ bearer: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: DAY12 }
        - name: version
          in: query
          description: A version; the latest when left out
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The package and image links
          content:
            application/json:
              schema:
                type: object
                required: [package, images, expires_at]
                properties:
                  package: { $ref: "#/components/schemas/PracticePackage" }
                  images:
                    type: object
                    description: Image file → download link
                    additionalProperties: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`enrolled_only`: a registered student and a test for SAT MAKON's students"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: no such test, or not published (yet), or no such version"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/Error" }

  /v1/practice/tests/{code}/stats:
    get:
      summary: How many students got each question right (students and teachers)
      description: |
        One entry per question of the test's latest published version, in the
        package's order (ids as in the package). Counted over every uploaded
        attempt that had the question, in any test or version (a question
        several tests share counts in all of them): `answered` is the attempts
        that took its section (a blank answer counts as answered and wrong),
        `correct` those graded right, with the keys of the version the attempt
        used (as its scores). Counted again every 5 minutes at most.
      operationId: practiceQuestionStats
      tags: [practice]
      security: [{ bearer: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: DAY12 }
      responses:
        "200":
          description: The questions' counts
          content:
            application/json:
              schema:
                type: object
                required: [questions]
                properties:
                  questions:
                    type: array
                    items:
                      type: object
                      required: [id, answered, correct]
                      properties:
                        id: { type: string, format: uuid, description: The question's id in the package }
                        answered: { type: integer }
                        correct: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: "`test_not_found`: no such test, or not published (yet)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/practice/attempts:
    post:
      summary: Upload a finished attempt (students)
      description: |
        Sent when the device is online, with the id the device gave the
        attempt: sending it again returns the stored attempt, so a retry
        after a lost answer is safe. The server grades it from the version's
        keys; its scores are the ones teachers see.
      operationId: savePracticeAttempt
      tags: [practice]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, test, version, sections, started_at, finished_at, answers]
              properties:
                id: { type: string, format: uuid }
                test: { type: string, description: The test's code }
                version: { type: integer }
                sections:
                  type: array
                  description: The sections taken, in order
                  items: { type: string, enum: [english, math] }
                started_at: { type: string, format: date-time }
                finished_at: { type: string, format: date-time }
                answers:
                  type: array
                  description: One per question seen, in the sections taken; blank answers are null
                  items: { $ref: "#/components/schemas/PracticeAnswer" }
      responses:
        "200":
          description: The stored attempt
          content: { application/json: { schema: { $ref: "#/components/schemas/PracticeAttempt" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student; `enrolled_only`: a registered student and a test for SAT MAKON's students"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`attempt_id_taken`: another student sent an attempt with this id"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_attempt`: no such test version, a section or question not in it, an answer given twice, times out of order"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/practice/reports:
    post:
      summary: Report an issue with a question (students)
      description: |
        From the test screen's "Report an issue": something wrong with the
        question (`kind: question`) or a technical problem (`technical`). Sent
        with the id the device made: sending it again answers 200 with the
        same id, so a retry is safe. The question must be the one at that
        place in that published version. A reason or a text (trimmed) is
        needed. The admins see reports in the panel.
      operationId: sendPracticeReport
      tags: [practice]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PracticeQuestionRef"
                - type: object
                  required: [id, kind]
                  properties:
                    id: { type: string, format: uuid }
                    kind: { type: string, enum: [question, technical] }
                    reason:
                      type: [string, "null"]
                      enum: [answer_key_wrong, typo, unclear, image_broken, formatting, other, null]
                    text: { type: string, maxLength: 2000, default: "" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
        "200":
          description: Stored before (a repeat)
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`report_id_taken`: another student sent a report with this id"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_report`: a value is wrong (the message says which), neither a reason nor a text, or the question isn't at that place in that version"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/practice/attempts:
    get:
      summary: The student's attempts, latest first, with their answers
      description: |
        With the answers the attempt was sent with, so a phone that doesn't have
        an attempt (a new phone) can store it and show its review.
      operationId: myPracticeAttempts
      tags: [practice]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The attempts
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/PracticeAttempt"
                        - type: object
                          required: [answers]
                          properties:
                            answers: { type: array, items: { $ref: "#/components/schemas/PracticeAnswer" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/teacher/groups/{id}/practice:
    get:
      summary: A group's students and their practice attempts (its teachers)
      operationId: groupPractice
      tags: [practice]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The students enrolled now, by name, each with their attempts latest first
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items:
                      type: object
                      required: [client_id, first_name, last_name, attempts]
                      properties:
                        client_id: { type: integer }
                        first_name: { type: string }
                        last_name: { type: string }
                        attempts: { type: array, items: { $ref: "#/components/schemas/PracticeAttempt" } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher, or not this group's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/goals:
    get:
      summary: The student's SAT goals (all null until set)
      operationId: myGoals
      tags: [practice]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The goals
          content: { application/json: { schema: { $ref: "#/components/schemas/Goals" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    put:
      summary: Set the student's SAT goals
      description: |
        Replaces all three: each may be null (a missing field counts as
        null). Targets are 200–800 in steps of 10. The exam date can't be
        before today (Tashkent), except the date already stored, so a
        student whose exam has passed can still change a target.
      operationId: setGoals
      tags: [practice]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_math: { type: [integer, "null"], minimum: 200, maximum: 800, multipleOf: 10 }
                target_rw: { type: [integer, "null"], minimum: 200, maximum: 800, multipleOf: 10 }
                exam_date: { type: [string, "null"], format: date }
      responses:
        "200":
          description: The stored goals
          content: { application/json: { schema: { $ref: "#/components/schemas/Goals" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_goals`: a target out of range or not a multiple of 10, or an exam date that isn't a date or is in the past"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/parked:
    get:
      summary: The student's parked questions ("Ask later"), newest first
      operationId: myParkedQuestions
      tags: [practice]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Every parked question of the student
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ParkedQuestion" } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/parked/{id}:
    parameters:
      - { name: id, in: path, required: true, description: The id the device made, schema: { type: string, format: uuid } }
    put:
      summary: Park a question, or change a parked one (students)
      description: |
        Creates the parked question or replaces its fields (idempotent by
        id, so a retry is safe). The question must be the one at that place
        in that published version. Texts are trimmed; a missing or blank
        `folder` is `Unsorted`, a missing `status` is `waiting`.
      operationId: saveParkedQuestion
      tags: [practice]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParkedQuestionInput" }
      responses:
        "200":
          description: The stored parked question
          content: { application/json: { schema: { $ref: "#/components/schemas/ParkedQuestion" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: the id is another student's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_parked`: a value is wrong (the message says which), or the question isn't at that place in that version"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remove a parked question (students)
      operationId: deleteParkedQuestion
      tags: [practice]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: the student has no parked question with this id (also when it was already removed)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/teacher/groups/{id}/parked:
    get:
      summary: The parked questions of a group's students (its teachers)
      operationId: groupParkedQuestions
      tags: [practice]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The parked questions of the students enrolled now, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ParkedQuestion"
                        - type: object
                          required: [student]
                          properties:
                            student: { $ref: "#/components/schemas/PracticeStudent" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher, or not this group's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/vocab/deck:
    get:
      summary: Every word list, to study offline (students and teachers)
      description: |
        SAT MAKON's word lists; every student sees every list. Send the
        version you have as `have`: if it is still current the answer is
        only `{version, unchanged: true}`. The version changes when the lists
        are imported again. Images (optional, per word) come from
        `/v1/vocab/lists/{slug}/images`.
      operationId: vocabDeck
      tags: [vocab]
      security: [{ bearer: [] }]
      parameters:
        - { name: have, in: query, description: The deck version on the phone, schema: { type: string } }
      responses:
        "200":
          description: The deck, or that the phone's is current
          content:
            application/json:
              schema:
                type: object
                required: [version, unchanged]
                properties:
                  version: { type: string, description: Empty while no list was ever imported }
                  unchanged: { type: boolean }
                  lists: { type: array, items: { $ref: "#/components/schemas/VocabList" }, description: Absent when unchanged }
        "401": { $ref: "#/components/responses/Error" }

  /v1/vocab/lists/{slug}/images:
    get:
      summary: Links to a list's word images
      description: Each link works for 6 hours (`expires_at`); download the images right away.
      operationId: vocabImages
      tags: [vocab]
      security: [{ bearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Image file → link
          content:
            application/json:
              schema:
                type: object
                required: [images, expires_at]
                properties:
                  images: { type: object, additionalProperties: { type: string, format: uri } }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/vocab/reviews:
    post:
      summary: Upload reviews from the phone's log (students)
      description: |
        The phone schedules with FSRS and keeps an append-only log of
        reviews; it uploads them here (at most 200 at a time) with each
        card's state after the review. A review already stored (same id) is
        skipped, so a retry is safe.
      operationId: saveVocabReviews
      tags: [vocab]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviews]
              properties:
                reviews: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/VocabReview" } }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [received, added]
                properties:
                  received: { type: integer }
                  added: { type: integer, description: New ones (the rest were stored already) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_reviews`: a review isn't valid (nothing of the batch is stored)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/vocab/reviews:
    get:
      summary: The student's reviews, to rebuild progress on a phone
      description: |
        In the order the server received them, 1000 at a time: pass the
        `next` of one answer as `after` for the next page; `next` is null on
        the last page. Keep the last `seq` seen to fetch only newer ones later.
      operationId: myVocabReviews
      tags: [vocab]
      security: [{ bearer: [] }]
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: A page of reviews
          content:
            application/json:
              schema:
                type: object
                required: [reviews, next]
                properties:
                  reviews: { type: array, items: { $ref: "#/components/schemas/VocabReview" } }
                  next: { type: [integer, "null"], format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/teacher/groups/{id}/vocab:
    get:
      summary: A group's students and their vocabulary progress (its teachers)
      operationId: groupVocab
      tags: [vocab]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The students enrolled now, by name
          content:
            application/json:
              schema:
                type: object
                required: [words, students]
                properties:
                  words: { type: integer, description: Words in all lists }
                  students:
                    type: array
                    items:
                      type: object
                      required: [client_id, first_name, last_name, started, learned, reviews_week, last_review]
                      properties:
                        client_id: { type: integer }
                        first_name: { type: string }
                        last_name: { type: string }
                        started: { type: integer, description: Words reviewed at least once }
                        learned: { type: integer, description: "Words whose next review is 21 days or more away (Anki's \"mature\")" }
                        reviews_week: { type: integer, description: Reviews in the last 7 days }
                        last_review: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher, or not this group's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/onboarding:
    get:
      summary: The registered student's onboarding answers
      description: What they last sent, with `updated_at`. 404 before they send any (and for anyone who isn't a student).
      operationId: myOnboarding
      tags: [roadmaps]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The answers
          content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send onboarding (registered students)
      description: |
        Spec 22.3. Stores the answers (works before a phone is added) and
        then:
        - sets the goals (`/v1/me/goals`): `target_math`, `target_rw` (so
          `target_total`), and `exam_date`, the first of `sat_dates` from
          today (Tashkent) on, or null;
        - gives a roadmap per subject in `focus`, at the level of that
          section's current score: below 450 Foundation, 450–590 Pre-SAT,
          600 and up Advanced; a total counts half for each section; no
          score, Foundation.
        Sending again replaces the answers and the roadmaps onboarding gave;
        progress is kept (by lesson). A course not imported yet gives no
        roadmap until it is. Scores are multiples of 10; `target.total`
        must be `target.math + target.rw`.
      operationId: sendOnboarding
      tags: [roadmaps]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingInput" } } }
      responses:
        "200":
          description: The profile (now `onboarded`) and the student's roadmaps
          content:
            application/json:
              schema:
                type: object
                required: [profile, roadmaps]
                properties:
                  profile: { $ref: "#/components/schemas/Profile" }
                  roadmaps: { type: array, items: { $ref: "#/components/schemas/RoadmapSummary" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "`not_needed`: not a registered student (enrolled students and teachers have no onboarding)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_onboarding`: the message says which field is wrong"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/roadmaps:
    get:
      summary: The student's roadmaps
      description: |
        Spec 22. Enrolled students: one per course their current groups'
        disciplines teach (`source: group`), everything open as they go.
        Registered students: those onboarding gave (`source: onboarding`),
        only the first country's units open (`free_units`). Teachers: none.
        Math first, then by level.
      operationId: myRoadmaps
      tags: [roadmaps]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The roadmaps
          content:
            application/json:
              schema:
                type: object
                required: [roadmaps]
                properties:
                  roadmaps: { type: array, items: { $ref: "#/components/schemas/RoadmapSummary" } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`: a registered student without a phone"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/roadmaps/{id}:
    get:
      summary: One of the student's roadmaps, with its route
      operationId: myRoadmap
      tags: [roadmaps]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: math-foundation } }
      responses:
        "200":
          description: The roadmap
          content: { application/json: { schema: { $ref: "#/components/schemas/Roadmap" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Not one of the student's roadmaps
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/roadmaps/{id}/lessons/{lessonId}:
    get:
      summary: A lesson's content, level check and homework
      description: A locked lesson stays hidden (403).
      operationId: myRoadmapLesson
      tags: [roadmaps]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lessonId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The lesson
          content: { application/json: { schema: { $ref: "#/components/schemas/RoadmapLessonDetail" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`lesson_locked`: opens once the lesson before it is done; `enrolled_only`: past what a free account opens; `phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Not one of the student's roadmaps, or no such lesson in it
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/roadmaps/{id}/lessons/{lessonId}/assessments:
    post:
      summary: Start (or continue) a level check or homework set
      description: |
        Returns the unfinished one of that kind (and set) if there is one;
        otherwise makes one with approved questions of the set's skills
        and difficulties (homework: its difficulty), preferring questions
        the student hasn't had in any roadmap assessment. Short at a
        difficulty, it fills from the neighbouring difficulty, then any
        difficulty of those skills; still short, it has fewer questions.
        A finished homework set can be practised again (it stays done); a
        level check can be retaken, with new questions where possible.
      operationId: startAssessment
      tags: [roadmaps]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lessonId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [level_check, homework] }
                index: { type: integer, minimum: 0, description: "The homework set (from 0); required for homework" }
      responses:
        "200":
          description: The assessment, open
          content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`lesson_locked`, `enrolled_only` or `phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No such roadmap, lesson or homework set for the student
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`no_questions`: the bank has no approved question for the set yet"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_assessment`: kind isn't level_check or homework, or homework without an index"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/assessments/{id}:
    get:
      summary: One of the student's assessments
      operationId: myAssessment
      tags: [roadmaps]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The assessment (with its result once submitted)
          content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/me/assessments/{id}/answers:
    put:
      summary: Save answers as the student goes
      description: Each answer given replaces that question's (null or "" clears it); the others stay.
      operationId: saveAssessmentAnswers
      tags: [roadmaps]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentAnswers" } } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`finished`: submitted already"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_answers`: a question that isn't the assessment's, or an answer over 32 characters"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/assessments/{id}/submit:
    post:
      summary: Submit and grade
      description: |
        Saves the answers sent (as PUT …/answers does) and grades the
        assessment exactly as practice tests are graded: the letter for
        multiple choice, any accepted form or the same number for grid-in.
        The percent is rounded down; a level check passes at 70 %.
      operationId: submitAssessment
      tags: [roadmaps]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentAnswers" } } }
      responses:
        "200":
          description: The assessment with its result, keys and explanations
          content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`finished`: submitted already"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_answers`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/logos/{slug}:
    get:
      summary: A roadmap stop's university logo
      description: |
        No sign-in (for `<img>`). Spec 22.7. SVG, PNG or WebP with its
        content type; `ETag` is its sha-256 (If-None-Match → 304) and
        `Cache-Control: public, max-age=86400`. Every answer carries
        `X-Content-Type-Options: nosniff` and `Content-Security-Policy:
        default-src 'none'; style-src 'unsafe-inline'; img-src data:;
        sandbox`. Link it with the `logo_url` the roadmap gives.
      operationId: getLogo
      tags: [roadmaps]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, example: queen-s-university } }
      responses:
        "200":
          description: The logo
          content:
            image/svg+xml: { schema: { type: string } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Unchanged (If-None-Match) }
        "404":
          description: No logo for this slug
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/assignments:
    get:
      summary: The student's assignments (spec 23)
      description: |
        Homework, level checks and exams the teachers of the student's current
        groups set: scheduled ones (locked until they open), the open and
        overdue ones, and closed ones the student has work on. Soonest deadline first. `mine` is how the student
        stands: the first finished work is the result; later tries count in
        `tries` and `best`. Teachers and registered students get an empty list.
      operationId: myAssignments
      tags: [assignments]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The assignments with the student's standing in each
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments: { type: array, items: { $ref: "#/components/schemas/StudentAssignment" } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/assignments/{id}/start:
    post:
      summary: Start an assigned homework or level check, or continue it
      description: |
        The student's open assessment for this assignment, else a new one with
        the assignment's questions (the same for everyone in the group). Then
        `GET /v1/me/assessments/{id}`, `PUT …/answers` and `POST …/submit` as
        for a roadmap lesson's. A finished one can be started again for
        practice; the first finished one stays the result. Exams are taken as
        the mock test itself (`/v1/practice/…`): the attempts count by themselves.
      operationId: startAssignment
      tags: [assignments]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The assessment, open or new
          content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`phone_required`; `forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: no such assignment of the student's groups"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`not_an_assessment`: an exam; `not_open`: it hasn't opened yet; `assignment_closed`: the teacher closed it; `no_questions`: its questions are gone from the bank"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/notifications:
    get:
      summary: The person's notifications, newest first (spec 23.5)
      operationId: myNotifications
      tags: [notifications]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: At most 100, and how many are unread
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread: { type: integer }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/notifications/read:
    put:
      summary: Mark notifications read
      operationId: readNotifications
      tags: [notifications]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer }, description: These (another person's are ignored) }
                all: { type: boolean, description: Every one of the person's }
      responses:
        "200":
          description: How many are unread now
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/teacher/assignments:
    get:
      summary: The assignments of the teacher's groups (spec 23)
      operationId: teacherAssignments
      tags: [assignments]
      security: [{ bearer: [] }]
      parameters:
        - { name: group_id, in: query, schema: { type: integer }, description: Only this group (one of theirs) }
      responses:
        "200":
          description: Newest first, each with its summary
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher, or not this group's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      summary: Give a group an assignment
      description: |
        Any teacher of the group (on its schedule now or later). A homework's
        or level check's questions are sent as drawn (`POST …/draw`) and
        swapped: 1–60 approved questions of the subject, in order. An exam
        names a published test and the sections to take. The title defaults
        to the lesson's, the set's or the test's. Every student of the group
        gets a notification.
      operationId: createAssignment
      tags: [assignments]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentInput" } } }
      responses:
        "201":
          description: The assignment
          content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentDetail" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher of the group"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_assignment`: a value is wrong (the message says which; `fields` names them)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/teacher/assignments/draw:
    post:
      summary: Draw questions for a homework or level check, without saving
      description: |
        From a curriculum lesson's level check (`course`, `lesson_id`), one of
        its homework sets (`homework_index` too), or custom (`subject`,
        `skills`, `mix`): approved questions of the subject with one of the
        skills, as many of each difficulty as asked, from the neighbouring
        difficulty when short, then any; fewer when still short, never none.
        With `group_id`, questions none of the group's students has had come
        first. With `question_ids` (and `subject`) it returns those questions
        in that order instead, in full: the way to see a set after swapping a
        question.
      operationId: drawAssignment
      tags: [assignments]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DrawInput" } } }
      responses:
        "200":
          description: The questions, easy to hard, with keys, explanations and image links
          content: { application/json: { schema: { $ref: "#/components/schemas/DrawResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: no such course, lesson or set"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`no_questions`: the bank has no approved question for the set"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_assignment`: the request names neither a lesson, nor skills and a mix, nor questions; or a value is wrong"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/teacher/assignments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: An assignment with its questions (its group's teachers)
      operationId: teacherAssignment
      tags: [assignments]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The assignment, its questions whole, and image links
          content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentDetail" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Change an assignment's title, instructions or dates, or close it
      description: Every field is sent. `closed` true closes it (no more starts; work in progress can still be finished); false opens it again.
      operationId: updateAssignment
      tags: [assignments]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentUpdate" } } }
      responses:
        "200":
          description: The assignment as it is now
          content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentDetail" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_assignment`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Delete an assignment nobody has started
      operationId: deleteAssignment
      tags: [assignments]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted, with its notifications }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`has_work`: a student has started it (close it instead)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/teacher/assignments/{id}/results:
    get:
      summary: "How the group did: each student, each question, the weakest skills"
      operationId: assignmentResults
      tags: [assignments]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The results
          content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentResults" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/teacher/assignments/{id}/results/{client_id}:
    get:
      summary: One student's work on the assignment
      description: Their first finished assessment, with the keys and the explanations, or for an exam the attempt that counted, with its answers.
      operationId: assignmentStudentResult
      tags: [assignments]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: client_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The assessment or the attempt; both null while they haven't finished
          content: { application/json: { schema: { $ref: "#/components/schemas/AssignmentStudentWork" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found`: no such assignment of theirs, or the student isn't in the group"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/teacher/questions:
    get:
      summary: Approved questions to put in a homework (teachers)
      operationId: teacherQuestions
      tags: [assignments]
      security: [{ bearer: [] }]
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string, enum: [math, english] } }
        - { name: skill, in: query, schema: { type: string }, description: One skill, in any case }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Text in the question }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Previews, newest approved first
          content:
            application/json:
              schema:
                type: object
                required: [questions, total]
                properties:
                  questions: { type: array, items: { $ref: "#/components/schemas/QuestionPreview" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/teacher/taxonomy:
    get:
      summary: Domains and skills, with how many approved questions each has (teachers)
      operationId: teacherTaxonomy
      tags: [assignments]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Per subject, the domains and their skills
          content: { application/json: { schema: { $ref: "#/components/schemas/TeacherTaxonomy" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/teacher/curriculum:
    get:
      summary: The imported courses, to pick a lesson's level check or homework (teachers)
      operationId: teacherCurriculum
      tags: [assignments]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Every course, math first, with its units, lessons and their set specs
          content: { application/json: { schema: { $ref: "#/components/schemas/TeacherCurriculum" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/teacher/groups/{id}/roadmap:
    get:
      summary: A group's roadmap progress (its teachers)
      description: The course or courses the group teaches (its discipline, or HolliHop's level for it), every lesson in order, and each student's standing per lesson as their own roadmap lays it out.
      operationId: groupRoadmap
      tags: [assignments]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The courses and the students
          content: { application/json: { schema: { $ref: "#/components/schemas/GroupRoadmap" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a teacher, or not this group's"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/me/parent-code:
    get:
      summary: The student's parent code
      description: |
        Five digits, the same for good: the student gives it to their parents,
        who enter it in the app (`POST /v1/parent/login`) to follow the child.
      operationId: myParentCode
      tags: [parents]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The code
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string, pattern: "^[0-9]{5}$" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`forbidden`: not a student"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/parent/login:
    post:
      summary: A parent signs in with a child's code
      description: |
        No parent accounts: the code is the child's (`/v1/me/parent-code`). The
        token opens only `/v1/parent/*`, read-only, for that child; a parent of
        several children signs in once per child. Tries are limited (10 per
        network and 5 per phone in 15 minutes: `429 rate_limited`), and many
        wrong codes in an hour alert the admins.
      operationId: parentLogin
      tags: [parents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device_id]
              properties:
                code: { type: string, example: "48213" }
                device_id: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Signed in (for 180 days after the last use)
          content:
            application/json:
              schema:
                type: object
                required: [token, child]
                properties:
                  token: { type: string }
                  child: { $ref: "#/components/schemas/ParentChild" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: "`invalid_parent_code`: no current student has this code"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/Error" }

  /v1/parent/logout:
    post:
      summary: Sign this phone out of a child
      operationId: parentLogout
      tags: [parents]
      security: [{ parent: [] }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }

  /v1/parent/child:
    get:
      summary: The child and their classes (schedule, teachers)
      description: A `401` means the session is gone or the child no longer studies here; ask for the code again.
      operationId: parentChild
      tags: [parents]
      security: [{ parent: [] }]
      responses:
        "200":
          description: The child
          content:
            application/json:
              schema:
                type: object
                required: [child, groups]
                properties:
                  child: { $ref: "#/components/schemas/ParentChild" }
                  groups:
                    type: array
                    description: As in `/v1/me`
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }

  /v1/parent/attendance:
    get:
      summary: The child's attendance
      description: The same table the student sees (`GET /v1/me/attendance`).
      operationId: parentAttendance
      tags: [parents]
      security: [{ parent: [] }]
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema:
                type: object
                required: [from, to, groups]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  groups: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }

  /v1/parent/reports:
    get:
      summary: This phone's reports about the child, newest first
      operationId: parentReports
      tags: [parents]
      security: [{ parent: [] }]
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports: { type: array, items: { $ref: "#/components/schemas/ParentReport" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Report a problem to the admins
      description: Goes to the admins of the child's branches (admin panel, Parent reports) and to their Telegram chat.
      operationId: sendParentReport
      tags: [parents]
      security: [{ parent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, lang]
              properties:
                message: { type: string, maxLength: 2000 }
                lang: { type: string, enum: [uz, ru], description: The language the parent uses the app in }
                group_id: { type: [integer, "null"], description: "Optional: the child's class it is about" }
      responses:
        "201":
          description: Sent
          content: { application/json: { schema: { $ref: "#/components/schemas/ParentReport" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422":
          description: "`invalid_report`: empty or too long, unknown lang, or a class the child isn't in"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/parent-reports:
    get:
      summary: Parents' reports about students of the admin's branches
      operationId: adminParentReports
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, handled], default: open } }
        - { name: office_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Newest first, at most 200
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports: { type: array, items: { $ref: "#/components/schemas/AdminParentReport" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/parent-reports/{id}/handled:
    post:
      summary: Mark a parent's report handled, with an optional answer the parent sees
      operationId: adminHandleParentReport
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reply: { type: string, maxLength: 1000 }
      responses:
        "204": { description: Handled }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found`: no such open report in the admin's branches"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/admin/parent-codes:
    get:
      summary: Find a student's parent code (for a parent who asks the office)
      operationId: adminParentCodes
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, required: true, description: "Part of the name, at least 2 characters", schema: { type: string } }
        - { name: office_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Current students of the admin's branches, at most 30
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items:
                      type: object
                      required: [client_id, first_name, last_name, groups, code]
                      properties:
                        client_id: { type: integer }
                        first_name: { type: string }
                        last_name: { type: string }
                        groups: { type: string, description: "Their current classes, comma-separated" }
                        code: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/login:
    post:
      summary: Admin sign-in with HolliHop credentials
      description: |
        HolliHop checks the login and password; then the person must be on
        the admin access list and not fired. Sets the `mb_admin` cookie.
      operationId: adminLogin
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: { schema: { type: string }, description: "`mb_admin` session cookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: "`invalid_credentials` — HolliHop refused the login or password"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`not_admin` (right credentials, but no panel access, or fired), `forbidden` (no `X-MakonBook-Admin` header)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`rate_limited` — 20 attempts per network or 5 per login name in 15 min. `Retry-After` gives seconds."
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`unavailable` — HolliHop isn't answering"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/logout:
    post:
      summary: End this admin session
      operationId: adminLogout
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      responses:
        "204": { description: Signed out; the cookie is cleared }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/me:
    get:
      summary: The signed-in admin and the branches they can see
      operationId: adminMe
      tags: [admin]
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfile" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/lessons:
    get:
      summary: Every lesson on a date in the admin's branches
      description: |
        By branch, then start time. `counts` appears once a teacher opened
        attendance. Lesson days are kept from the day the app went live, and
        known up to 14 days ahead. Only lessons someone can take attendance
        for are listed: at least one teacher on the schedule who is in
        MakonBook and not fired. A lesson with nobody on the list is listed
        only for a newly opened group (`new_group`); otherwise the group is
        finished in practice. Both kinds of left-out groups are listed by
        `GET /v1/admin/data-quality` for admins to fix in HolliHop.
        Online lessons (an online branch or learning type) are never listed,
        here or in `data-quality`.
      operationId: adminLessons
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today at the school }
        - $ref: "#/components/parameters/OfficeFilter"
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                type: object
                required: [date, lessons]
                properties:
                  date: { type: string, format: date }
                  lessons: { type: array, items: { $ref: "#/components/schemas/AdminLesson" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/attendance/sessions/{id}:
    get:
      summary: One lesson's attendance, with every change and the HolliHop write status
      operationId: adminAttendanceSession
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionID" }
      responses:
        "200": { $ref: "#/components/responses/AdminAttendanceSession" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found` — no such session, or not in the admin's branches"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/attendance/sessions/{id}/marks/{client_id}:
    put:
      summary: Admin's correction of one student's mark
      description: |
        Any time, while open or after it finished. Audited with the admin's
        name; a changed present/absent is written to HolliHop again. The
        teacher can't change the mark back afterwards. Billing isn't touched
        here: an absence is billed unless an admin unbills it in HolliHop (D17).
      operationId: adminSetAttendanceMark
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
        - { $ref: "#/components/parameters/SessionID" }
        - { name: client_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [present, late, absent] }
      responses:
        "200": { $ref: "#/components/responses/AdminAttendanceSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found` (session) or `not_in_roster`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/reports/corrections:
    get:
      summary: Teachers' corrections of marks, for lessons in a date range
      description: |
        Per teacher: lessons they opened and how often they changed marks —
        `made_present` counts absent or not-scanned students they marked
        present or late, the change worth a second look. `changes` lists the
        500 newest changes by teachers and admins.
      operationId: adminCorrectionsReport
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: Defaults to 29 days before `to` }
        - { name: to, in: query, schema: { type: string, format: date }, description: Defaults to today }
        - { name: teacher_id, in: query, schema: { type: integer }, description: Only this teacher's changes }
        - $ref: "#/components/parameters/OfficeFilter"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionsReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/hollihop/writes:
    get:
      summary: Attendance written (or to be written) to HolliHop
      description: |
        `counts` covers every status; `writes` lists the 500 newest with the
        requested statuses. `set_manually`: an admin had set that day by hand
        in HolliHop, so the app's mark wasn't applied there.
      operationId: adminHolliHopWrites
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses; defaults to `failed,set_manually`.
          schema: { type: string, example: "failed,set_manually" }
        - $ref: "#/components/parameters/OfficeFilter"
      responses:
        "200":
          description: Writes
          content:
            application/json:
              schema:
                type: object
                required: [writing_enabled, counts, writes]
                properties:
                  writing_enabled: { type: boolean, description: "false: dry run — nothing is sent to HolliHop" }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  writes: { type: array, items: { $ref: "#/components/schemas/HolliHopWrite" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/hollihop/writes/{id}/retry:
    post:
      summary: Send a failed write again
      operationId: adminRetryHolliHopWrite
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Queued }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found` — not a failed write in the admin's branches, or a newer write replaced it"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/data-quality:
    get:
      summary: What admins should fix in HolliHop
      description: |
        `groups`: groups with lessons from today on that need an admin —
        `no_teacher` (no teacher on the schedule who can take attendance) or
        `no_students` (nobody on the list of a group that isn't new: in
        practice finished, but its schedule was never closed). These are
        left out of `GET /v1/admin/lessons`.
        `issues`: people who can't sign in until their phone is fixed —
        students by their branches or their groups' branches, teachers by the
        branches they teach in.
      operationId: adminDataQuality
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OfficeFilter"
      responses:
        "200":
          description: Open issues
          content:
            application/json:
              schema:
                type: object
                required: [groups, issues]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/GroupIssue" } }
                  issues: { type: array, items: { $ref: "#/components/schemas/DataQualityIssue" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/access:
    get:
      summary: Who can use the admin panel (super admins only)
      operationId: adminAccessList
      tags: [admin]
      security: [{ adminCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccessList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/access/{member_type}/{member_id}:
    parameters:
      - { name: member_type, in: path, required: true, schema: { type: string, enum: [employee, teacher] } }
      - { name: member_id, in: path, required: true, schema: { type: integer }, description: HolliHop employee or teacher id }
    put:
      summary: Make someone a branch admin and/or practice editor, or change that (super admins only)
      description: |
        The name comes from HolliHop. An editor needs no branches, but a grant
        must give at least one branch or `editor`. The panel only manages
        branch admins and editors:
        it can't make anyone a super admin, nor change any super admin
        (another one or yourself) — 403 `super_admin_protected`. Super admins
        are managed on the server (`makonbook admin grant|revoke`).
      operationId: adminGrantAccess
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [office_ids]
              properties:
                super: { type: boolean, const: false, description: "Must be false or absent: super admins are made on the server" }
                office_ids: { type: array, items: { type: integer }, description: "May be empty for an editor only" }
                editor: { type: boolean, description: May edit practice tests and questions }
      responses:
        "200": { $ref: "#/components/responses/AccessList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`super_admin_protected` (a super admin, or `super: true`), `forbidden` (not a super admin, or no CSRF header)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found` — no such employee in HolliHop, or teacher in MakonBook"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`fired` in HolliHop"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a branch admin (super admins only); their sessions end at once
      description: Super admins can't be removed in the panel (403 `super_admin_protected`), yourself included.
      operationId: adminRevokeAccess
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      responses:
        "200": { $ref: "#/components/responses/AccessList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/staff:
    get:
      summary: Search HolliHop's employees, to give one access (super admins only)
      operationId: adminFindStaff
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 }, description: "Name, phone or email" }
      responses:
        "200":
          description: Up to 50 employees
          content:
            application/json:
              schema:
                type: object
                required: [staff]
                properties:
                  staff:
                    type: array
                    items:
                      type: object
                      required: [id, name, position, fired, offices]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        position: { type: string }
                        fired: { type: boolean }
                        offices: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/tests:
    get:
      summary: Practice tests and how far their review has come (editors)
      operationId: adminPracticeTests
      tags: [admin]
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Every loaded test
          content:
            application/json:
              schema:
                type: object
                required: [tests]
                properties:
                  tests: { type: array, items: { $ref: "#/components/schemas/PracticeTestSummary" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/tests/{code}:
    get:
      summary: One test with its questions in order (editors)
      operationId: adminPracticeTest
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: "e.g. DAY12" }
      responses:
        "200":
          description: The test
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PracticeTestSummary"
                  - type: object
                    required: [slots]
                    properties:
                      slots:
                        type: array
                        description: The test's questions in order (each with its `position`)
                        items: { $ref: "#/components/schemas/PracticeQuestionSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/questions:
    get:
      summary: Questions to work on, red first, then yellow, then green (editors)
      operationId: adminPracticeQuestions
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: risk, in: query, schema: { type: string, enum: [red, yellow, green] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, review, approved] } }
        - { name: subject, in: query, schema: { type: string, enum: [math, english] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of questions
          content:
            application/json:
              schema:
                type: object
                required: [questions, total]
                properties:
                  questions: { type: array, items: { $ref: "#/components/schemas/PracticeQuestionSummary" } }
                  total: { type: integer, description: All questions matching the filters }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/questions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A question with its AI reviews and versions (editors)
      operationId: adminPracticeQuestion
      tags: [admin]
      security: [{ adminCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/PracticeQuestion" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Save an edit as a new version (editors)
      description: |
        The whole content, plus the version it was made on. An approved
        question goes back to review. Subject and type don't change.
      operationId: adminPracticeUpdateQuestion
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeQuestionEdit" }
      responses:
        "200": { $ref: "#/components/responses/PracticeQuestion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`version_conflict`: someone saved the question after it was opened"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_question`, with `fields`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/practice/questions/{id}/approval:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approve a question, or take an approval back (editors)
      description: |
        Approves the version the editor saw (a test opens to students once
        all its questions are approved). Approving runs the checks a save
        does, so a question without a key can't pass. `approved: false`
        sends it back to review, whoever approved it.
      operationId: adminPracticeApproval
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, approved]
              properties:
                version: { type: integer, description: The version the editor saw. }
                approved: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/PracticeQuestion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`version_conflict`: someone saved the question after it was opened"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_question`, with `fields`: it can't be approved as it is"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/practice/questions/{id}/picture:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: test, in: query, required: false, schema: { type: string }, description: "The test whose place the picture shows (a question can be in several)." }
    post:
      summary: Draw the question as a picture (editors' Export image)
      description: |
        Draws the content sent (the editor's form, saved or not) on the
        question picture template the Telegram group's pictures use, and
        returns it as a PNG to download. Needs the renderer (RENDERER_URL).
      operationId: adminPracticePicture
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeQuestionEdit" }
      responses:
        "200":
          description: The picture, 2560 px wide.
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/taxonomy:
    get:
      summary: The digital SAT's domains and skills, per subject (editors)
      operationId: adminPracticeTaxonomy
      tags: [admin]
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: subject → domain → skills
          content:
            application/json:
              schema:
                type: object
                required: [subjects]
                properties:
                  subjects:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/images:
    post:
      summary: Upload an image for a question (editors)
      description: |
        PNG, JPEG, GIF or WebP, at most 5 MB and 6000 px a side; kept in
        MakonBook's database. The answer's `key` goes into the text as
        `![description](r2:<key>)` and into `figures`. The same file uploaded
        again gets the same key.
      operationId: adminPracticeUploadImage
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [key, width, height]
                properties:
                  key: { type: string, description: "mb/<hash>.<ext>" }
                  width: { type: integer }
                  height: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/reports:
    get:
      summary: Students' issue reports on questions (any admin)
      operationId: adminPracticeReports
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved], default: open } }
      responses:
        "200":
          description: Newest first, at most 200
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports: { type: array, items: { $ref: "#/components/schemas/AdminPracticeReport" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/admin/practice/reports/{id}:
    put:
      summary: Resolve a report, or open it again (any admin)
      description: Resolving keeps who resolved it first and when; opening again clears both.
      operationId: adminSetPracticeReport
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/AdminCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, resolved] }
      responses:
        "200":
          description: The report
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminPracticeReport" } } }
        "400":
          description: "`bad_request`: status isn't open or resolved"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "`not_found`: no such report"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/admin/practice/figures:
    get:
      summary: A question image, from the bank's R2 bucket or an upload (editors)
      operationId: adminPracticeFigure
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: key, in: query, required: true, schema: { type: string, maxLength: 300 }, description: "R2 key as in the question, e.g. sat/question_images/x.png" }
      responses:
        "200":
          description: The image
          content:
            image/*: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    parent:
      type: http
      scheme: bearer
      description: A parent's token from `POST /v1/parent/login`; it opens only `/v1/parent/*`.
    adminCookie:
      type: apiKey
      in: cookie
      name: mb_admin

  schemas:
    AdminLesson:
      allOf:
        - $ref: "#/components/schemas/Lesson"
        - type: object
          required: [office_id, teachers, counts, new_group]
          properties:
            new_group:
              type: boolean
              description: Opened within 30 days and nobody has attended yet; an empty list is expected.
            office_id: { type: [integer, "null"] }
            teachers: { type: array, items: { type: string } }
            counts:
              type: [object, "null"]
              description: Null until a teacher opens attendance.
              required: [present, late, absent, pending]
              properties:
                present: { type: integer }
                late: { type: integer }
                absent: { type: integer }
                pending: { type: integer }

    AdminAttendanceSession:
      allOf:
        - $ref: "#/components/schemas/AttendanceSession"
        - type: object
          description: Never has `qr`; each mark has `hollihop`.
          required: [office_id, office, opened_by, finished_by, history]
          properties:
            office_id: { type: [integer, "null"] }
            office: { type: string }
            opened_by: { type: string, description: The teacher who started attendance }
            finished_by: { type: [string, "null"], enum: [teacher, auto, null] }
            history:
              type: array
              description: Every change of a mark, oldest first.
              items:
                type: object
                required: [client_id, student_name, actor_kind, actor_name, from, to, at]
                properties:
                  client_id: { type: integer }
                  student_name: { type: string }
                  actor_kind: { type: string, enum: [student, teacher, admin, system], description: "student = scanned; system = absent when attendance finished" }
                  actor_name: { type: string }
                  from: { type: string }
                  to: { type: string }
                  at: { type: string, format: date-time }

    CorrectionsReport:
      type: object
      required: [from, to, teachers, changes]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        teachers:
          type: array
          items:
            type: object
            required: [teacher_id, teacher_name, lessons_opened, lessons_corrected, corrections, made_present]
            properties:
              teacher_id: { type: integer }
              teacher_name: { type: string }
              lessons_opened: { type: integer }
              lessons_corrected: { type: integer }
              corrections: { type: integer }
              made_present: { type: integer }
        changes:
          type: array
          items:
            type: object
            required: [id, at, actor_kind, actor_name, from, to, session_id, date, group_id, group_name, client_id, student_name]
            properties:
              id: { type: integer }
              at: { type: string, format: date-time }
              actor_kind: { type: string, enum: [teacher, admin] }
              actor_name: { type: string }
              from: { type: string }
              to: { type: string }
              session_id: { type: string, format: uuid }
              date: { type: string, format: date }
              group_id: { type: integer }
              group_name: { type: string }
              client_id: { type: integer }
              student_name: { type: string }

    WriteStatus:
      type: string
      enum: [pending, sent, unchanged, set_manually, dry_run, superseded, failed]

    HolliHopWrite:
      type: object
      required: [id, session_id, date, group_id, group_name, client_id, student_name, absent, status, attempts, error, created_at, done_at]
      properties:
        id: { type: integer }
        session_id: { type: string, format: uuid }
        date: { type: string, format: date }
        group_id: { type: integer }
        group_name: { type: string }
        client_id: { type: integer }
        student_name: { type: string }
        absent: { type: boolean }
        status: { $ref: "#/components/schemas/WriteStatus" }
        attempts: { type: integer }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        done_at: { type: [string, "null"], format: date-time }

    GroupIssue:
      type: object
      required: [kind, group_id, group_name, office_id, office, individual, teachers, fired_teacher, students, next_lesson, schedule_since, last_attended]
      properties:
        kind: { type: string, enum: [no_teacher, no_students] }
        group_id: { type: integer }
        group_name: { type: string }
        office_id: { type: [integer, "null"] }
        office: { type: string }
        individual: { type: boolean, description: One-to-one or pair lessons, not a group }
        teachers: { type: array, items: { type: string }, description: Teachers who can take attendance (empty for no_teacher) }
        fired_teacher: { type: boolean, description: "no_teacher: the schedule names only fired or unknown teachers" }
        students: { type: integer, description: On the list of the next lesson }
        next_lesson: { type: string, format: date }
        schedule_since: { type: [string, "null"], format: date }
        last_attended: { type: [string, "null"], format: date, description: "Last lesson anyone attended (HolliHop marks, last 120 days)" }

    DataQualityIssue:
      type: object
      required: [id, person_kind, person_id, first_name, last_name, phone, kind, detail, since]
      properties:
        id: { type: integer }
        person_kind: { type: string, enum: [student, teacher] }
        person_id: { type: integer, description: HolliHop client id or teacher id }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string, description: As typed in HolliHop }
        kind:
          type: string
          enum: [phone_missing, phone_invalid, phone_duplicate, self_account_conflict]
          description: "self_account_conflict: the number is a self-registered account's, which the sync merges only with a new HolliHop student"
        detail: { type: string }
        since: { type: string, format: date-time }

    AdminAccess:
      type: object
      required: [member_type, member_id, name, super, editor, offices, granted_at, last_login_at]
      properties:
        member_type: { type: string, enum: [Employee, Teacher] }
        member_id: { type: integer }
        name: { type: string }
        super: { type: boolean }
        editor: { type: boolean, description: May edit practice content (super admins may anyway) }
        offices: { type: array, items: { $ref: "#/components/schemas/Office" }, description: Empty for super admins and editors only }
        granted_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }

    PracticeTestSummary:
      type: object
      required: [code, title, questions, approved, red, yellow, shared, open, published]
      properties:
        code: { type: string, description: "The bank's test id, e.g. DAY12" }
        title: { type: string }
        questions: { type: integer }
        approved: { type: integer }
        red: { type: integer, description: Red questions not yet approved }
        yellow: { type: integer, description: Yellow questions not yet approved }
        shared: { type: integer, description: Questions other tests use too }
        open: { type: boolean, description: "Every question approved: students can take it" }
        published: { type: integer, description: "The latest published version; 0 while never published" }

    ParentChild:
      type: object
      required: [client_id, first_name, last_name]
      properties:
        client_id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }

    ParentReport:
      type: object
      required: [id, group_id, group_name, message, created_at, handled_at, reply]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: [integer, "null"] }
        group_name: { type: string, description: Empty when not about a class }
        message: { type: string }
        created_at: { type: string, format: date-time }
        handled_at: { type: [string, "null"], format: date-time }
        reply: { type: [string, "null"], description: The admin's answer }

    AdminParentReport:
      type: object
      required: [id, client_id, first_name, last_name, group_id, group_name, message, lang, created_at, handled_at, handled_by, reply]
      properties:
        id: { type: integer, format: int64 }
        client_id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        group_id: { type: [integer, "null"] }
        group_name: { type: string }
        message: { type: string }
        lang: { type: string, enum: [uz, ru] }
        created_at: { type: string, format: date-time }
        handled_at: { type: [string, "null"], format: date-time }
        handled_by: { type: [string, "null"] }
        reply: { type: [string, "null"] }

    VocabList:
      type: object
      required: [slug, title, words]
      properties:
        slug: { type: string, example: sat-1 }
        title: { type: string }
        words:
          type: array
          items:
            type: object
            required: [id, word, part_of_speech, definition, example, image]
            properties:
              id: { type: string, format: uuid, description: Stays the same across imports }
              word: { type: string }
              part_of_speech: { type: [string, "null"] }
              definition: { type: string }
              example: { type: string }
              image:
                type: [object, "null"]
                required: [file, bytes, width, height]
                properties:
                  file: { type: string }
                  bytes: { type: integer }
                  width: { type: integer }
                  height: { type: integer }

    VocabReview:
      type: object
      description: One review and the card's FSRS state after it (ts-fsrs's Card fields).
      required: [id, word_id, rating, reviewed_at, duration_ms, state, due, stability, difficulty, scheduled_days]
      properties:
        seq: { type: integer, format: int64, description: The server's order (in answers only) }
        id: { type: string, format: uuid, description: The phone's }
        word_id: { type: string, format: uuid }
        rating: { type: integer, enum: [1, 2, 3, 4], description: "1 again, 2 hard, 3 good, 4 easy" }
        reviewed_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0, description: Time to answer }
        state: { type: integer, enum: [0, 1, 2, 3], description: "After: 0 new, 1 learning, 2 review, 3 relearning" }
        due: { type: string, format: date-time }
        stability: { type: number }
        difficulty: { type: number }
        scheduled_days: { type: integer, minimum: 0 }

    PracticeCatalogTest:
      type: object
      required: [code, title, english, math, questions, approved, version, bytes, published_at]
      properties:
        code: { type: string, example: DAY12 }
        title: { type: string }
        english: { type: integer, description: Questions in Reading and Writing }
        math: { type: integer, description: Questions in Math }
        questions: { type: integer }
        approved: { type: integer }
        version: { type: [integer, "null"], description: The latest published version; null while locked }
        bytes: { type: [integer, "null"], description: "The download's size: the package and its images" }
        published_at: { type: [string, "null"], format: date-time }
        enrolled_only:
          type: boolean
          description: "Registered students only: for SAT MAKON's students, locked for this person (version null). Left out otherwise"

    PracticePackage:
      type: object
      description: |
        A published version of a test (format 1). Sections come in Bluebook
        order (Reading and Writing, then Math), each with two timed modules.
        Text uses the stored content format: paragraphs, `\( \)` and
        `\[ \]` math, `*i*`, `**b**`, `<u>`, `- ` lists, pipe tables and
        `![alt](r2:key)` images, whose files `images` names.
      required: [format, code, title, version, published_at, sections, images]
      properties:
        format: { type: integer, enum: [1] }
        code: { type: string }
        title: { type: string }
        version: { type: integer }
        published_at: { type: string, format: date-time }
        sections:
          type: array
          items:
            type: object
            required: [subject, modules, scale]
            properties:
              subject: { type: string, enum: [english, math] }
              scale:
                type: array
                items: { type: integer }
                description: The estimated 200–800 section score for each number right (index 0 … questions)
              modules:
                type: array
                items:
                  type: object
                  required: [module, minutes, questions]
                  properties:
                    module: { type: integer, enum: [1, 2] }
                    minutes: { type: integer }
                    questions:
                      type: array
                      items: { $ref: "#/components/schemas/PracticePackageQuestion" }
        images:
          type: object
          description: An image's key (as the text uses it) → its file
          additionalProperties:
            type: object
            required: [file, bytes, width, height]
            properties:
              file: { type: string }
              bytes: { type: integer }
              width: { type: integer }
              height: { type: integer }

    PracticePackageQuestion:
      type: object
      required: [id, version, position, type, passage, stem, choices, figures, correct, accepted, explanation, domain, skill, difficulty]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, description: The question's own version }
        position: { type: integer }
        type: { type: string, enum: [mcq, grid_in] }
        passage: { type: [string, "null"] }
        stem: { type: string }
        choices:
          type: [object, "null"]
          description: A–D for mcq
          additionalProperties: { type: string }
        figures:
          type: array
          items:
            type: object
            required: [key, kind, alt]
            properties:
              key: { type: string }
              kind: { type: string }
              alt: { type: string }
        correct: { type: [string, "null"], description: The letter, for mcq }
        accepted:
          type: [array, "null"]
          items: { type: string }
          description: "Grid-in: every form accepted; the same number in another form (.5 for 1/2) counts too"
        explanation: { type: string }
        domain: { type: string }
        skill: { type: string }
        difficulty: { type: [string, "null"], enum: [easy, medium, hard, null] }

    PracticeAnswer:
      type: object
      required: [subject, module, position, answer, seconds]
      properties:
        subject: { type: string, enum: [english, math] }
        module: { type: integer, enum: [1, 2] }
        position: { type: integer }
        answer: { type: [string, "null"], description: "A letter, or a grid-in answer as typed" }
        seconds: { type: integer, minimum: 0, maximum: 21600, description: Time spent on the question }

    PracticeAttempt:
      type: object
      required: [id, test, title, version, sections, started_at, finished_at, scores, total]
      properties:
        id: { type: string, format: uuid }
        test: { type: string }
        title: { type: string }
        version: { type: integer }
        sections: { type: array, items: { type: string, enum: [english, math] } }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        scores:
          type: object
          description: Per section taken (english, math)
          additionalProperties:
            type: object
            required: [raw, questions, score]
            properties:
              raw: { type: integer, description: Questions right }
              questions: { type: integer }
              score: { type: integer, description: "Estimated, 200–800" }
        total: { type: [integer, "null"], description: "Both sections' sum (400–1600) when both were taken" }

    PracticeQuestionRef:
      type: object
      description: A question at its place in a published version, as in the package.
      required: [test, version, subject, module, position, question_id]
      properties:
        test: { type: string, description: The test's code, example: DAY12 }
        version: { type: integer, minimum: 1 }
        subject: { type: string, enum: [english, math] }
        module: { type: integer, enum: [1, 2] }
        position: { type: integer, minimum: 1 }
        question_id: { type: string, format: uuid, description: The question's id in the package }

    ParkedQuestionInput:
      allOf:
        - $ref: "#/components/schemas/PracticeQuestionRef"
        - type: object
          properties:
            folder: { type: [string, "null"], maxLength: 40, description: "Trimmed; null or blank: `Unsorted`" }
            reason:
              type: [string, "null"]
              enum: [didnt_understand, didnt_know_start, lost_partway, ran_out_of_time, null]
            note: { type: string, maxLength: 1000, default: "" }
            fix: { type: string, maxLength: 300, default: "", description: "The fix in one line, once the student understands it" }
            status: { type: string, enum: [waiting, sorted], default: waiting }

    ParkedQuestion:
      allOf:
        - $ref: "#/components/schemas/PracticeQuestionRef"
        - type: object
          required: [id, folder, reason, note, fix, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            folder: { type: string, minLength: 1, maxLength: 40 }
            reason:
              type: [string, "null"]
              enum: [didnt_understand, didnt_know_start, lost_partway, ran_out_of_time, null]
            note: { type: string }
            fix: { type: string }
            status: { type: string, enum: [waiting, sorted] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Goals:
      type: object
      required: [target_math, target_rw, target_total, exam_date, updated_at]
      properties:
        target_math: { type: [integer, "null"], description: "Math target, 200–800" }
        target_rw: { type: [integer, "null"], description: "Reading and Writing target, 200–800" }
        target_total: { type: [integer, "null"], description: "The two targets' sum, when both are set" }
        exam_date: { type: [string, "null"], format: date }
        updated_at: { type: [string, "null"], format: date-time, description: Null when never set }

    OnboardingScores:
      type: object
      description: "A total, or the two sections"
      properties:
        total: { type: integer, minimum: 400, maximum: 1600, multipleOf: 10 }
        math: { type: integer, minimum: 200, maximum: 800, multipleOf: 10 }
        rw: { type: integer, minimum: 200, maximum: 800, multipleOf: 10 }

    OnboardingInput:
      type: object
      required: [graduation, sat_dates, current, target, focus, schedule]
      properties:
        graduation: { type: string, enum: ["2027", "2028", "2029", "2030", "2031", "2032", "2033", "2034", graduated] }
        sat_dates:
          type: array
          description: SAT dates they may sit (any order, kept sorted); empty means not decided
          items: { type: string, format: date }
          maxItems: 12
        current:
          description: "Their score so far: null (none), {total} or {math, rw}"
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/OnboardingScores" }
        target:
          type: object
          required: [total, math, rw]
          description: total = math + rw
          properties:
            total: { type: integer, minimum: 400, maximum: 1600, multipleOf: 10 }
            math: { type: integer, minimum: 200, maximum: 800, multipleOf: 10 }
            rw: { type: integer, minimum: 200, maximum: 800, multipleOf: 10 }
        focus: { type: string, enum: [math, english, both] }
        schedule:
          type: object
          required: [days, minutes]
          properties:
            days:
              type: array
              minItems: 1
              description: Kept in week order
              items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
            minutes: { type: integer, enum: [15, 30, 45, 60] }

    Onboarding:
      allOf:
        - { $ref: "#/components/schemas/OnboardingInput" }
        - type: object
          required: [updated_at]
          properties:
            updated_at: { type: string, format: date-time }

    RoadmapSummary:
      type: object
      required: [id, subject, level, title, source, group_name, lessons_done, lessons_total, units_done, units_total, current, free_units]
      properties:
        id: { type: string, description: "<subject>-<level>", example: math-foundation }
        subject: { type: string, enum: [math, english] }
        level: { type: string, enum: [foundation, pre-sat, advanced] }
        title: { type: string, example: "Math · Foundation" }
        source: { type: string, enum: [group, onboarding] }
        group_name: { type: [string, "null"], description: "The group it comes from (source group)" }
        lessons_done: { type: integer }
        lessons_total: { type: integer }
        units_done: { type: integer }
        units_total: { type: integer }
        current:
          description: The first lesson not done (it may be locked); null when everything is done
          oneOf:
            - type: "null"
            - type: object
              required: [unit_id, unit_title, lesson_id, lesson_title, university, logo_url]
              properties:
                unit_id: { type: string }
                unit_title: { type: string }
                lesson_id: { type: string }
                lesson_title: { type: string }
                university: { type: string }
                logo_url: { type: [string, "null"], description: "The university's logo: /v1/logos/{slug}?v=…, relative to the API; null if none" }
        free_units: { type: [integer, "null"], description: "Free accounts: how many units are open (the first country's); null for enrolled students" }

    RoadmapStop:
      type: object
      required: [university, city, country, logo_url]
      properties:
        university: { type: string }
        city: { type: string }
        country: { type: string }
        logo_url:
          type: [string, "null"]
          description: "The university's logo, /v1/logos/{slug}?v=<first 8 of its sha-256> (relative to the API; the version changes with the file, so it can be cached); null if none"

    Roadmap:
      allOf:
        - { $ref: "#/components/schemas/RoadmapSummary" }
        - type: object
          required: [countries, units]
          properties:
            countries:
              type: array
              items:
                type: object
                required: [id, name, code, units]
                properties:
                  id: { type: string, example: south-korea }
                  name: { type: string }
                  code: { type: [string, "null"], description: "ISO 3166-1 alpha-2, lower case (for a flag); null if unknown", example: kr }
                  units: { type: array, items: { type: string }, description: Unit ids, in order }
            units:
              type: array
              items:
                type: object
                required: [id, title, domain, summary, stop, status, lock, lessons]
                properties:
                  id: { type: string }
                  title: { type: string }
                  domain: { type: string }
                  summary: { type: string }
                  stop: { $ref: "#/components/schemas/RoadmapStop" }
                  status: { type: string, enum: [done, open, locked] }
                  lock: { type: [string, "null"], enum: [previous, enrolled_only, null] }
                  lessons:
                    type: array
                    items:
                      type: object
                      required: [id, title, minutes, status, lock, level_check, homework]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        minutes: { type: integer }
                        status: { type: string, enum: [done, open, locked] }
                        lock: { type: [string, "null"], enum: [previous, enrolled_only, null] }
                        level_check:
                          type: object
                          required: [questions, best, passed]
                          properties:
                            questions: { type: integer }
                            best: { type: [integer, "null"], description: Best percent }
                            passed: { type: boolean }
                        homework:
                          type: object
                          required: [sets, done]
                          properties:
                            sets: { type: integer }
                            done: { type: integer }

    AssessmentRef:
      type: object
      required: [id, percent, finished_at]
      properties:
        id: { type: string, format: uuid }
        percent: { type: integer }
        finished_at: { type: string, format: date-time }

    RoadmapLessonDetail:
      type: object
      required: [lesson, level_check, homework]
      properties:
        lesson:
          type: object
          required: [id, title, unit_id, minutes, skills, objectives, notes, examples, common_mistakes, status, lock]
          properties:
            id: { type: string }
            title: { type: string }
            unit_id: { type: string }
            minutes: { type: integer }
            skills: { type: array, items: { type: string } }
            objectives: { type: array, items: { type: string } }
            notes: { type: string, description: "The API's content format (render like question text)" }
            examples:
              type: array
              items:
                type: object
                required: [problem, steps, answer]
                properties:
                  problem: { type: string }
                  steps: { type: array, items: { type: string } }
                  answer: { type: string }
            common_mistakes: { type: array, items: { type: string } }
            status: { type: string, enum: [done, open] }
            lock: { type: "null" }
        level_check:
          type: object
          required: [questions, mix, pass_percent, best, passed, attempts, open]
          properties:
            questions: { type: integer }
            mix:
              type: object
              required: [easy, medium, hard]
              properties:
                easy: { type: integer }
                medium: { type: integer }
                hard: { type: integer }
            pass_percent: { type: integer, example: 70 }
            best: { type: [integer, "null"] }
            passed: { type: boolean }
            attempts: { type: array, items: { $ref: "#/components/schemas/AssessmentRef" }, description: "Finished ones, newest first" }
            open:
              oneOf:
                - type: "null"
                - { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
        homework:
          type: array
          items:
            type: object
            required: [index, title, difficulty, questions, done, attempt, open]
            properties:
              index: { type: integer }
              title: { type: string }
              difficulty: { type: string, enum: [easy, medium, hard] }
              questions: { type: integer }
              done: { type: boolean }
              attempt:
                description: The latest finished one
                oneOf:
                  - type: "null"
                  - { $ref: "#/components/schemas/AssessmentRef" }
              open:
                oneOf:
                  - type: "null"
                  - { type: object, required: [id], properties: { id: { type: string, format: uuid } } }

    AssessmentAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          description: Question id → the letter (mcq) or what was entered (grid-in); null clears
          additionalProperties: { type: [string, "null"], maxLength: 32 }
        times:
          type: object
          description: "Question id → seconds spent on it so far (each replaces that question's); for the teacher's statistics"
          additionalProperties: { type: integer, minimum: 0, maximum: 21600 }

    Assessment:
      type: object
      required: [id, kind, roadmap_id, lesson_id, homework_index, assignment, title, subject, created_at, finished_at, questions, images, answers, times, result]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [level_check, homework] }
        roadmap_id: { type: [string, "null"], description: "The course; null for a custom homework assignment" }
        lesson_id: { type: [string, "null"], description: "null for a custom homework assignment" }
        homework_index: { type: [integer, "null"] }
        assignment:
          description: The assignment it was started from (spec 23); null for the roadmap's own
          oneOf:
            - type: "null"
            - type: object
              required: [id, kind, title, due_at]
              properties:
                id: { type: string, format: uuid }
                kind: { $ref: "#/components/schemas/AssignmentKind" }
                title: { type: string }
                due_at: { type: string, format: date-time }
        title: { type: string }
        subject: { type: string, enum: [math, english] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        questions:
          type: array
          description: Easy to hard. While open, without correct, accepted and explanation.
          items:
            type: object
            required: [id, position, type, passage, stem, choices, figures, domain, skill, difficulty]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer, description: From 1 }
              type: { type: string, enum: [mcq, grid_in] }
              passage: { type: [string, "null"] }
              stem: { type: string }
              choices: { type: [object, "null"], additionalProperties: { type: string } }
              figures: { type: array, items: { $ref: "#/components/schemas/PracticeFigure" } }
              domain: { type: string }
              skill: { type: string }
              difficulty: { type: [string, "null"], enum: [easy, medium, hard, null] }
              correct: { type: string, description: "Once submitted, mcq: the letter" }
              accepted: { type: array, items: { type: string }, description: "Once submitted, grid-in: the accepted forms" }
              explanation: { type: string, description: Once submitted }
        images:
          type: object
          description: "A figure's key (in ![alt](r2:key)) → a link an <img> loads (signed, https, works for 6 hours; read the assessment again for fresh ones). A figure that can't be had is missing."
          additionalProperties:
            type: object
            required: [url, width, height]
            properties:
              url: { type: string }
              width: { type: integer }
              height: { type: integer }
        answers:
          type: object
          description: Every question id → the saved answer or null
          additionalProperties: { type: [string, "null"] }
        times:
          type: object
          description: Question id → seconds spent, as the client sent them
          additionalProperties: { type: integer }
        result:
          oneOf:
            - type: "null"
            - type: object
              required: [percent, correct, total, passed, lesson_done, items]
              properties:
                percent: { type: integer, description: Rounded down }
                correct: { type: integer }
                total: { type: integer }
                passed: { type: boolean, description: "Level check: percent ≥ 70; homework: always true" }
                lesson_done: { type: boolean, description: The lesson is done now (as of reading this) }
                items:
                  type: array
                  items:
                    type: object
                    required: [question_id, given, correct, correct_answer, explanation]
                    properties:
                      question_id: { type: string, format: uuid }
                      given: { type: [string, "null"] }
                      correct: { type: boolean }
                      correct_answer: { type: string, description: The letter, or the first accepted form }
                      explanation: { type: string }

    AssignmentKind:
      type: string
      enum: [homework, level_check, exam]

    AssignmentStatus:
      type: string
      enum: [scheduled, open, overdue, closed]
      description: "scheduled: not open yet; open; overdue: the deadline passed, work is still taken and marked late; closed: the teacher closed it, no more starts"

    AssignmentLesson:
      type: object
      description: The curriculum lesson an assignment comes from
      required: [course, lesson_id, title, unit_id, unit_title]
      properties:
        course: { type: string, example: math-pre-sat }
        lesson_id: { type: string }
        title: { type: string }
        unit_id: { type: string }
        unit_title: { type: string }

    AssignmentTest:
      type: object
      description: The mock test of an exam
      required: [code, title, sections, english, math]
      properties:
        code: { type: string, example: DAY12 }
        title: { type: string }
        sections: { type: array, items: { type: string, enum: [english, math] }, description: The sections to take }
        english: { type: integer, description: Questions in Reading and Writing }
        math: { type: integer, description: Questions in Math }

    AssignmentMix:
      type: object
      required: [easy, medium, hard]
      properties:
        easy: { type: integer, minimum: 0 }
        medium: { type: integer, minimum: 0 }
        hard: { type: integer, minimum: 0 }

    ImageLinks:
      type: object
      description: "A figure's key (in ![alt](r2:key)) → a link an <img> loads (signed, https, works for 6 hours). A figure that can't be had is missing."
      additionalProperties:
        type: object
        required: [url, width, height]
        properties:
          url: { type: string }
          width: { type: integer }
          height: { type: integer }

    AssignmentQuestion:
      type: object
      description: A question as the teacher sees it, whole
      required: [id, position, type, passage, stem, choices, figures, correct, accepted, explanation, domain, skill, difficulty]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, description: From 1 }
        type: { type: string, enum: [mcq, grid_in] }
        passage: { type: [string, "null"] }
        stem: { type: string }
        choices: { type: [object, "null"], additionalProperties: { type: string } }
        figures: { type: array, items: { $ref: "#/components/schemas/PracticeFigure" } }
        correct: { type: [string, "null"], description: "The letter, for mcq" }
        accepted: { type: [array, "null"], items: { type: string }, description: "Grid-in: the accepted forms" }
        explanation: { type: string }
        domain: { type: string }
        skill: { type: string }
        difficulty: { type: [string, "null"], enum: [easy, medium, hard, null] }

    QuestionPreview:
      type: object
      required: [id, type, domain, skill, difficulty, preview]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [mcq, grid_in] }
        domain: { type: string }
        skill: { type: string }
        difficulty: { type: [string, "null"], enum: [easy, medium, hard, null] }
        preview: { type: string, description: The start of the question as plain text }

    AssignmentSummary:
      type: object
      description: How the group stands on an assignment
      required: [students, done, late, in_progress, average_percent, average_score]
      properties:
        students: { type: integer, description: In the group now }
        done: { type: integer }
        late: { type: integer, description: Done after the deadline }
        in_progress: { type: integer, description: Homework and level checks started and not finished }
        average_percent: { type: [number, "null"], description: "Homework and level checks: the mean percent of those done" }
        average_score: { type: [number, "null"], description: "Exams: the mean total (one section: its score) of those done" }

    Assignment:
      type: object
      required: [id, group_id, group_name, teacher_id, kind, status, title, instructions, subject, lesson, homework_index, test, skills, mix, questions, opens_at, due_at, closed_at, created_at, updated_at, summary]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: integer }
        group_name: { type: string }
        teacher_id: { type: integer, description: Who gave it }
        kind: { $ref: "#/components/schemas/AssignmentKind" }
        status: { $ref: "#/components/schemas/AssignmentStatus" }
        title: { type: string }
        instructions: { type: string }
        subject: { type: string, enum: [math, english] }
        lesson:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AssignmentLesson"
        homework_index: { type: [integer, "null"], description: The lesson's homework set it comes from }
        test:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AssignmentTest"
        skills: { type: array, items: { type: string } }
        mix:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AssignmentMix"
        questions: { type: integer, description: How many }
        opens_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        summary: { $ref: "#/components/schemas/AssignmentSummary" }

    AssignmentDetail:
      allOf:
        - $ref: "#/components/schemas/Assignment"
        - type: object
          required: [items, images]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AssignmentQuestion" }, description: "The set, in order; empty for an exam" }
            images: { $ref: "#/components/schemas/ImageLinks" }

    AssignmentInput:
      type: object
      required: [group_id, kind, due_at]
      properties:
        group_id: { type: integer }
        kind: { $ref: "#/components/schemas/AssignmentKind" }
        title: { type: string, maxLength: 120, description: "Defaults to the lesson's, the set's or the test's" }
        instructions: { type: string, maxLength: 2000 }
        opens_at: { type: string, format: date-time, description: Default now }
        due_at: { type: string, format: date-time }
        course: { type: string, description: "With lesson_id: the curriculum course", example: math-pre-sat }
        lesson_id: { type: string, description: "Level checks, and homework from the curriculum" }
        homework_index: { type: integer, minimum: 0, description: "Homework from the curriculum: the lesson's set" }
        subject: { type: string, enum: [math, english], description: Custom homework (without a lesson) }
        skills: { type: array, items: { type: string }, description: "Custom homework: for the record" }
        mix: { $ref: "#/components/schemas/AssignmentMix" }
        question_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 60, description: "Homework and level checks: the set, in order" }
        test: { type: string, description: "Exams: a published test's code" }
        sections: { type: array, items: { type: string, enum: [english, math] }, minItems: 1, description: "Exams: the sections to take" }

    AssignmentUpdate:
      type: object
      required: [title, instructions, opens_at, due_at, closed]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        instructions: { type: string, maxLength: 2000 }
        opens_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        closed: { type: boolean }

    DrawInput:
      type: object
      properties:
        group_id: { type: integer, description: Prefer questions none of this group's students has had }
        course: { type: string }
        lesson_id: { type: string }
        homework_index: { type: integer, minimum: 0 }
        subject: { type: string, enum: [math, english] }
        skills: { type: array, items: { type: string } }
        mix: { $ref: "#/components/schemas/AssignmentMix" }
        question_ids: { type: array, items: { type: string, format: uuid }, maxItems: 60, description: These questions, in this order, in full }

    DrawResult:
      type: object
      required: [subject, skills, mix, items, images]
      properties:
        subject: { type: string, enum: [math, english] }
        skills: { type: array, items: { type: string } }
        mix:
          description: What was asked for; null for a set given by ids
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AssignmentMix"
        items: { type: array, items: { $ref: "#/components/schemas/AssignmentQuestion" } }
        images: { $ref: "#/components/schemas/ImageLinks" }

    SectionScores:
      type: object
      description: Per section taken (english, math)
      additionalProperties:
        type: object
        required: [raw, questions, score]
        properties:
          raw: { type: integer, description: Questions right }
          questions: { type: integer }
          score: { type: integer, description: "Estimated, 200–800" }

    AssignmentStanding:
      type: object
      description: "How a student stands on an assignment: the first finished work is the result"
      required: [status, assessment_id, attempt_id, started_at, finished_at, late, percent, correct, total, passed, scores, total_score, tries, best]
      properties:
        status: { type: string, enum: [new, in_progress, done] }
        assessment_id: { type: [string, "null"], format: uuid, description: "Homework and level checks: the open one, or the first finished" }
        attempt_id: { type: [string, "null"], format: uuid, description: "Exams: the attempt that counted" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        late: { type: boolean, description: Finished after the deadline }
        percent: { type: [integer, "null"], description: Homework and level checks }
        correct: { type: [integer, "null"] }
        total: { type: [integer, "null"] }
        passed: { type: [boolean, "null"], description: "Level checks: 70 % or more; homework: true once done; exams: null" }
        scores:
          description: Exams
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SectionScores"
        total_score: { type: [integer, "null"], description: "Exams: both sections' sum, or the one section's score" }
        tries: { type: integer, description: Finished ones, the first included }
        best: { type: [integer, "null"], description: "The best percent (exams: the best total or section score)" }

    StudentAssignment:
      type: object
      required: [id, kind, status, title, instructions, subject, group_id, group_name, lesson, test, questions, opens_at, due_at, closed_at, mine]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AssignmentKind" }
        status: { type: string, enum: [scheduled, open, overdue, closed], description: "scheduled: not open yet (until opens_at); students see it locked, and starting it answers 409 not_open" }
        title: { type: string }
        instructions: { type: string }
        subject: { type: string, enum: [math, english] }
        group_id: { type: integer }
        group_name: { type: string }
        lesson:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AssignmentLesson"
        test:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AssignmentTest"
        questions: { type: integer, description: "How many; for an exam, in the sections to take" }
        opens_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        mine: { $ref: "#/components/schemas/AssignmentStanding" }

    AssignmentStudentResult:
      allOf:
        - $ref: "#/components/schemas/AssignmentStanding"
        - type: object
          required: [client_id, first_name, last_name]
          properties:
            client_id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }

    AssignmentQuestionStats:
      type: object
      required: [question_id, position, subject, module, skill, difficulty, answered, correct, answers, avg_seconds]
      properties:
        question_id: { type: string, format: uuid }
        position: { type: integer, description: From 1, in the set's (or the test's) order }
        subject: { type: string, enum: [math, english] }
        module: { type: [integer, "null"], description: Exams }
        skill: { type: string }
        difficulty: { type: [string, "null"], enum: [easy, medium, hard, null] }
        answered: { type: integer, description: Students whose counted work has the question (a blank counts) }
        correct: { type: integer }
        answers: { type: object, additionalProperties: { type: integer }, description: "mcq: A–D and blank; grid-in: correct, wrong, blank" }
        avg_seconds: { type: [number, "null"], description: Over the work with a time for it }

    AssignmentResults:
      type: object
      required: [assignment, students, questions, skills]
      properties:
        assignment: { $ref: "#/components/schemas/Assignment" }
        students: { type: array, items: { $ref: "#/components/schemas/AssignmentStudentResult" }, description: The group's roster now, by name }
        questions: { type: array, items: { $ref: "#/components/schemas/AssignmentQuestionStats" } }
        skills:
          type: array
          description: Wrong answers per skill, most first
          items:
            type: object
            required: [skill, wrong, total]
            properties:
              skill: { type: string }
              wrong: { type: integer }
              total: { type: integer }

    PracticeOwnAttempt:
      allOf:
        - $ref: "#/components/schemas/PracticeAttempt"
        - type: object
          required: [answers]
          properties:
            answers: { type: array, items: { $ref: "#/components/schemas/PracticeAnswer" } }

    AssignmentStudentWork:
      type: object
      required: [assessment, attempt]
      properties:
        assessment:
          description: Homework and level checks
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Assessment"
        attempt:
          description: Exams
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PracticeOwnAttempt"

    TeacherCurriculum:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            type: object
            required: [id, subject, level, title, units]
            properties:
              id: { type: string, example: math-pre-sat }
              subject: { type: string, enum: [math, english] }
              level: { type: string, enum: [foundation, pre-sat, advanced] }
              title: { type: string, example: "Math · Pre-SAT" }
              units:
                type: array
                items:
                  type: object
                  required: [id, title, university, lessons]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    university: { type: string }
                    lessons:
                      type: array
                      items:
                        type: object
                        required: [id, title, skills, level_check, homework]
                        properties:
                          id: { type: string }
                          title: { type: string }
                          skills: { type: array, items: { type: string } }
                          level_check:
                            type: object
                            required: [questions, mix, skills]
                            properties:
                              questions: { type: integer }
                              mix: { $ref: "#/components/schemas/AssignmentMix" }
                              skills: { type: array, items: { type: string } }
                          homework:
                            type: array
                            items:
                              type: object
                              required: [index, title, difficulty, questions, skills]
                              properties:
                                index: { type: integer }
                                title: { type: string }
                                difficulty: { type: string, enum: [easy, medium, hard] }
                                questions: { type: integer }
                                skills: { type: array, items: { type: string } }

    TeacherTaxonomy:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: object
          description: "math and english: the domains, each with its skills and approved counts"
          additionalProperties:
            type: array
            items:
              type: object
              required: [domain, skills]
              properties:
                domain: { type: string }
                skills:
                  type: array
                  items:
                    type: object
                    required: [skill, easy, medium, hard, total]
                    properties:
                      skill: { type: string }
                      easy: { type: integer, description: Approved questions at this difficulty }
                      medium: { type: integer }
                      hard: { type: integer }
                      total: { type: integer, description: Approved questions, unestimated ones included }

    GroupRoadmap:
      type: object
      required: [courses, students]
      properties:
        courses:
          type: array
          description: Math first; empty when the group maps to no course
          items:
            type: object
            required: [id, subject, level, title, lessons]
            properties:
              id: { type: string }
              subject: { type: string, enum: [math, english] }
              level: { type: string, enum: [foundation, pre-sat, advanced] }
              title: { type: string }
              lessons:
                type: array
                description: In course order
                items:
                  type: object
                  required: [id, title, unit_id, unit_title, university, homework_sets]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    unit_id: { type: string }
                    unit_title: { type: string }
                    university: { type: string }
                    homework_sets: { type: integer }
        students:
          type: array
          description: The roster now, by name
          items:
            type: object
            required: [client_id, first_name, last_name, courses]
            properties:
              client_id: { type: integer }
              first_name: { type: string }
              last_name: { type: string }
              courses:
                type: object
                description: By course id; lessons in the course's order
                additionalProperties:
                  type: object
                  required: [lessons_done, lessons_total, current_lesson_id, lessons]
                  properties:
                    lessons_done: { type: integer }
                    lessons_total: { type: integer }
                    current_lesson_id: { type: [string, "null"], description: The first lesson not done; null when all are }
                    lessons:
                      type: array
                      items:
                        type: object
                        required: [status, passed, best, homework_done]
                        properties:
                          status: { type: string, enum: [done, open, locked] }
                          passed: { type: boolean }
                          best: { type: [integer, "null"] }
                          homework_done: { type: integer }

    Notification:
      type: object
      required: [id, kind, title, body, link, created_at, read_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [assignment] }
        title: { type: string }
        body: { type: string }
        link: { type: [string, "null"], description: "A path in the web app, e.g. /homework" }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }

    AdminPracticeReport:
      allOf:
        - $ref: "#/components/schemas/PracticeQuestionRef"
        - type: object
          required: [id, test_title, kind, reason, text, status, created_at, resolved_at, resolved_by, student]
          properties:
            id: { type: string, format: uuid }
            test_title: { type: string, description: Empty if the test is gone }
            kind: { type: string, enum: [question, technical] }
            reason:
              type: [string, "null"]
              enum: [answer_key_wrong, typo, unclear, image_broken, formatting, other, null]
            text: { type: string }
            status: { type: string, enum: [open, resolved] }
            created_at: { type: string, format: date-time }
            resolved_at: { type: [string, "null"], format: date-time }
            resolved_by: { type: [string, "null"], description: The admin's name }
            student: { $ref: "#/components/schemas/PracticeStudent" }

    PracticeStudent:
      type: object
      required: [id, first_name, last_name]
      properties:
        id: { type: integer, description: The student's HolliHop client id }
        first_name: { type: string }
        last_name: { type: string }

    PracticePlace:
      type: object
      required: [test, subject, module, position]
      properties:
        test: { type: string }
        subject: { type: string, enum: [math, english] }
        module: { type: integer, enum: [1, 2] }
        position: { type: integer }

    PracticeQuestionSummary:
      type: object
      required: [id, subject, type, status, ai_risk, preview, version, places]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string, enum: [math, english] }
        type: { type: string, enum: [mcq, grid_in] }
        status: { type: string, enum: [draft, review, approved] }
        ai_risk: { type: [string, "null"], enum: [red, yellow, green, null] }
        preview: { type: string, description: The start of the question as plain text }
        version: { type: integer }
        places: { type: array, items: { $ref: "#/components/schemas/PracticePlace" } }
        position: { $ref: "#/components/schemas/PracticePlace" }

    PracticeFigure:
      type: object
      required: [key, kind, alt]
      properties:
        key: { type: string, description: R2 object key }
        kind: { type: string }
        alt: { type: string }

    PracticeContent:
      type: object
      description: |
        Text fields use the content format: paragraphs, `\( \)` and `\[ \]` math,
        `*italic*`, `**bold**`, `<u>underline</u>`, `- ` lists, pipe tables and
        `![alt](r2:key)` figures.
      required: [passage, stem, choices, figures, correct, accepted, explanation, domain, skill, difficulty]
      properties:
        passage: { type: [string, "null"] }
        stem: { type: string }
        choices:
          type: [object, "null"]
          description: A–D, for mcq
          additionalProperties: { type: string }
        figures: { type: array, items: { $ref: "#/components/schemas/PracticeFigure" } }
        correct: { type: [string, "null"], description: The letter, for mcq }
        accepted: { type: [array, "null"], items: { type: string }, description: Every accepted form, for grid-in }
        explanation: { type: string }
        domain: { type: string }
        skill: { type: string }
        difficulty: { type: [string, "null"], enum: [easy, medium, hard, null], description: An estimate }

    PracticeQuestion:
      allOf:
        - $ref: "#/components/schemas/PracticeContent"
        - type: object
          required: [id, subject, type, status, ai_risk, version, updated_at, approved_at, auto_approved, approved_by, places, reviews, versions]
          properties:
            id: { type: string, format: uuid }
            subject: { type: string, enum: [math, english] }
            type: { type: string, enum: [mcq, grid_in] }
            status: { type: string, enum: [draft, review, approved] }
            ai_risk: { type: [string, "null"], enum: [red, yellow, green, null] }
            version: { type: integer }
            updated_at: { type: string, format: date-time }
            approved_at: { type: [string, "null"], format: date-time }
            auto_approved:
              type: boolean
              description: Approved on import because its AI review was green. A worse review of a repeat or an editor's change takes it back.
            approved_by: { type: [string, "null"], description: The person who approved it in the editor. }
            places: { type: array, items: { $ref: "#/components/schemas/PracticePlace" } }
            reviews:
              type: array
              items:
                type: object
                required: [test, qid, risk, verdict, record, imported_at]
                properties:
                  test: { type: string }
                  qid: { type: string }
                  risk: { type: string, enum: [red, yellow, green] }
                  verdict: { type: string }
                  record: { type: object, description: "The AI review's whole record (makonbook-questionbank format)" }
                  imported_at: { type: string, format: date-time }
            versions:
              type: array
              description: Newest first
              items:
                type: object
                required: [version, source, created_by, created_at, content]
                properties:
                  version: { type: integer }
                  source: { type: string, enum: [import, ai_fix, group, editor, draft], description: "ai_fix: the fix the AI review proposed, applied to a question it approved; group: a fix the review group approved; draft: a question added with `makonbook practice add`, written outside the AI review" }
                  created_by: { type: [string, "null"] }
                  created_at: { type: string, format: date-time }
                  content: { type: object }

    PracticeQuestionEdit:
      type: object
      required: [version, stem, explanation, domain, skill]
      properties:
        version: { type: integer, description: The version the edit was made on }
        passage: { type: [string, "null"] }
        stem: { type: string }
        choices: { type: [object, "null"], additionalProperties: { type: string } }
        figures: { type: [array, "null"], items: { $ref: "#/components/schemas/PracticeFigure" } }
        correct: { type: string }
        accepted: { type: [array, "null"], items: { type: string } }
        explanation: { type: string }
        domain: { type: string }
        skill: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard, ""] }

    AdminLoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, maxLength: 100, description: HolliHop login }
        password: { type: string, maxLength: 256 }

    AdminProfile:
      type: object
      required: [name, member_type, member_id, super, editor, offices]
      properties:
        name: { type: string }
        member_type: { type: string, enum: [Employee, Teacher], description: As HolliHop reports it }
        member_id: { type: integer, description: HolliHop employee or teacher id }
        super: { type: boolean, description: Sees every branch and manages the access list }
        editor: { type: boolean, description: "May edit practice tests (true for super admins)" }
        offices:
          type: array
          description: The branches this admin can see (all of them, for a super admin).
          items: { $ref: "#/components/schemas/Office" }

    Office:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: HolliHop office id }
        name: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Phone number in any common format (`+998901234567`, `90 123 45 67`), username, or email (anything with `@`).
          maxLength: 100
        password: { type: string, maxLength: 256 }
        device_id:
          type: string
          maxLength: 100
          description: Random id the app generates once per install.

    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string, description: Bearer token. Store it in secure storage. }
        expires_at:
          type: string
          format: date-time
          description: Extended on use; a session unused for 30 days expires.
        user: { $ref: "#/components/schemas/Profile" }

    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string, description: "May be left out or empty when has_password is false (no password of their own yet)" }
        new_password: { type: string, minLength: 8, maxLength: 128 }

    Username:
      type: object
      required: [username]
      properties:
        username:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.]{2,29}$"

    Profile:
      type: object
      required: [kind, id, first_name, last_name, username, must_change_password, groups]
      properties:
        kind: { type: string, enum: [student, teacher] }
        id: { type: integer, description: HolliHop client id (students) or teacher id }
        first_name: { type: string, description: "Their own (PUT /v1/me/profile), else HolliHop's" }
        last_name: { type: string }
        username: { type: [string, "null"] }
        must_change_password: { type: boolean }
        status:
          type: string
          enum: [enrolled, registered]
          description: "registered: signed up themselves, not (yet) a SAT MAKON student (no classes; some practice tests). Teachers: enrolled"
        phone: { type: [string, "null"], description: "The login phone, E.164; null for a registered student who hasn't added one (the content is locked: 403 phone_required)" }
        email: { type: [string, "null"], description: "Their email (lower case), from sign-up; they can sign in with it" }
        google: { type: boolean, description: A Google account is linked }
        telegram: { type: boolean, description: A Telegram account is linked }
        photo_url: { type: [string, "null"], description: "Their photo, e.g. /v1/photos/…, on the API's origin (no token needed)" }
        has_password: { type: boolean, description: "Their own password (false while on the default one, or signed up with Google only)" }
        onboarded: { type: boolean, description: "Registered students: they have sent onboarding (POST /v1/me/onboarding). Always true for enrolled students and teachers" }
        groups:
          type: array
          description: Current and upcoming groups (enrolled in, or teaching).
          items: { $ref: "#/components/schemas/Group" }

    Group:
      type: object
      required: [id, name, discipline, learning_type, office, schedule]
      properties:
        id: { type: integer }
        name: { type: string }
        discipline: { type: string, example: PRE SAT MATH }
        learning_type: { type: string, example: GROUP }
        session:
          description: The lesson's attendance session, once opened
          oneOf:
            - type: "null"
            - type: object
              required: [id, status]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [open, finished] }
        office: { type: string, example: NOVZA }
        schedule:
          type: array
          items: { $ref: "#/components/schemas/Slot" }

    Slot:
      type: object
      required: [weekdays, begin_time, end_time, classroom, teachers]
      properties:
        weekdays:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        begin_time: { type: string, example: "14:00", description: School time zone }
        end_time: { type: string, example: "15:30" }
        classroom: { type: string }
        begin_date: { type: string, format: date, description: Absent when open-ended }
        end_date: { type: string, format: date, description: Absent when open-ended }
        teachers: { type: array, items: { type: string } }

    Lesson:
      type: object
      required: [group_id, group_name, discipline, office, classroom, begin_time, end_time, starts_at, ends_at, students, attendance_enabled, learning_type, session]
      properties:
        group_id: { type: integer }
        group_name: { type: string }
        discipline: { type: string, example: PRE SAT MATH }
        office: { type: string, example: NOVZA }
        classroom: { type: string }
        begin_time: { type: string, example: "14:00", description: School time }
        end_time: { type: string, example: "15:30" }
        starts_at: { type: string, format: date-time, example: "2026-10-12T14:00:00+05:00" }
        ends_at: { type: string, format: date-time }
        students: { type: integer, description: "Roster size on this date: enrollments current that day, of active students" }
        attendance_enabled: { type: boolean }
        learning_type: { type: string, example: GROUP }
        session:
          type: [object, "null"]
          description: The lesson's attendance, once a teacher started it.
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [open, finished] }

    AttendanceSession:
      type: object
      required: [id, group_id, group_name, date, starts_at, ends_at, late_after, opened_at, finished_at, status, editable_until, counts, marks]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: integer }
        group_name: { type: string }
        date: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        late_after: { type: string, format: date-time, description: Scans after this are late }
        opened_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [open, finished] }
        editable_until: { type: string, format: date-time, description: Teacher corrections allowed until then }
        qr: { $ref: "#/components/schemas/AttendanceQR" }
        counts:
          type: object
          required: [total, present, late, absent, pending]
          properties:
            total: { type: integer }
            present: { type: integer }
            late: { type: integer }
            absent: { type: integer }
            pending: { type: integer }
        marks:
          type: array
          items:
            type: object
            required: [client_id, first_name, last_name, state, source, scanned_at]
            properties:
              client_id: { type: integer }
              first_name: { type: string }
              last_name: { type: string }
              state: { type: string, enum: [pending, present, late, absent] }
              source: { type: [string, "null"], enum: [scan, teacher, admin, auto, null], description: "admin = corrected by the office in the admin panel" }
              scanned_at: { type: [string, "null"], format: date-time }
              hollihop:
                description: Admin panel only — where this mark's latest write to HolliHop stands.
                type: object
                required: [status, error]
                properties:
                  status: { $ref: "#/components/schemas/WriteStatus" }
                  error: { type: [string, "null"] }

    AttendanceQR:
      type: object
      description: |
        Present only while the session is open. The teacher's app draws a new
        code every `window_seconds`:

            window = floor(unix_seconds / 10)      (use server_time to correct the device clock)
            sig    = first 16 chars of base64url_nopad(HMAC-SHA256(secret_bytes, "<id>:<window>"))

        `secret` is base64url without padding; `<id>` is the session id as a
        lowercase UUID string. The server accepts the current window ±1.
      required: [secret, window_seconds, server_time]
      properties:
        secret: { type: string }
        window_seconds: { type: integer, example: 10 }
        server_time: { type: string, format: date-time }

    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }

    AppConfig:
      type: object
      required: [min_app_version]
      properties:
        signup: { type: boolean, description: "Sign-up with an email code is available (Google and Telegram make accounts on their own)" }
        reset: { type: boolean, description: "Password reset by SMS code, and adding a phone by SMS, are available" }
        email: { type: boolean, description: Sign-up can start with an email code }
        google: { type: boolean, description: Google sign-in is available }
        telegram: { type: boolean, description: Telegram sign-in is available }
        min_app_version:
          type: object
          required: [android, ios]
          properties:
            android: { type: string, example: "1.0.0" }
            ios: { type: string, example: "1.0.0" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - not_found
                - internal
                - unavailable
                - bad_request
                - unauthorized
                - forbidden
                - rate_limited
                - invalid_credentials
                - account_locked
                - password_change_required
                - wrong_password
                - weak_password
                - invalid_username
                - username_taken
                - attendance_disabled
                - too_early
                - lesson_over
                - session_closed
                - invalid_code
                - code_expired
                - not_in_roster
                - device_already_used
                - marked_absent
                - edit_window_closed
                - not_admin
                - set_by_admin
                - super_admin_protected
                - fired
                - version_conflict
                - invalid_question
                - invalid_attempt
                - attempt_id_taken
                - invalid_reviews
                - invalid_parent_code
                - invalid_report
                - test_not_found
                - invalid_parked
                - report_id_taken
                - invalid_goals
                - sms_unavailable
                - invalid_phone
                - too_many_tries
                - invalid_ticket
                - invalid_profile
                - no_account
                - google_taken
                - invalid_email
                - email_taken
                - email_unavailable
                - telegram_unavailable
                - telegram_no_phone
                - phone_already_set
                - phone_required
                - photo_too_large
                - invalid_photo
                - google_unavailable
                - enrolled_only
                - invalid_onboarding
                - not_needed
                - lesson_locked
                - no_questions
                - finished
                - invalid_answers
                - invalid_assessment
                - invalid_assignment
                - assignment_closed
                - not_open
                - not_an_assessment
                - has_work
            message:
              type: string
              description: Human-readable explanation; may change.
            fields:
              type: object
              additionalProperties: { type: string }
              description: "For a rejected form (`invalid_question`): what is wrong, per field (e.g. `stem`, `choices.B`)."
            request_id:
              type: string

  parameters:
    OfficeFilter:
      name: office_id
      in: query
      description: Only this branch (one outside the admin's branches yields nothing).
      schema: { type: integer }
    AdminCSRF:
      name: X-MakonBook-Admin
      in: header
      required: true
      description: Any value. Proves the request comes from the admin panel's own page.
      schema: { type: string }
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    PracticeQuestion:
      description: The question
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PracticeQuestion" }
    AdminAttendanceSession:
      description: The session as the admin panel shows it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminAttendanceSession" }
    AccessList:
      description: The access list (after the change)
      content:
        application/json:
          schema:
            type: object
            required: [access]
            properties:
              access: { type: array, items: { $ref: "#/components/schemas/AdminAccess" } }
    AttendanceSession:
      description: The session as the teacher's screen shows it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AttendanceSession" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
