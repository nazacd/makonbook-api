name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine # same major version as production
        env:
          POSTGRES_USER: makonbook
          POSTGRES_PASSWORD: makonbook
          POSTGRES_DB: makonbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makonbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://makonbook:makonbook@localhost:5432/makonbook_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          # Build the linter with this repo's Go version; a linter built with
          # an older Go refuses to analyse newer code.
          install-mode: goinstall

  generated:
    name: generated code up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check-generated
