# One generated package per feature, so a feature can only query tables
# through its own queries file (spec 14.1).
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/system/queries.sql
    gen:
      go:
        package: systemdb
        out: internal/system/systemdb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/people/queries.sql
    gen:
      go:
        package: peopledb
        out: internal/people/peopledb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/sync/queries.sql
    gen:
      go:
        package: syncdb
        out: internal/sync/syncdb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/auth/queries.sql
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/lessons/queries.sql
    gen:
      go:
        package: lessondb
        out: internal/lessons/lessondb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/attendance/queries.sql
    gen:
      go:
        package: attendancedb
        out: internal/attendance/attendancedb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/admin/queries.sql
    gen:
      go:
        package: admindb
        out: internal/admin/admindb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/practice/queries.sql
    gen:
      go:
        package: practicedb
        out: internal/practice/practicedb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/reviewbot/queries.sql
    gen:
      go:
        package: reviewbotdb
        out: internal/reviewbot/reviewbotdb
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: internal/vocab/queries.sql
    gen:
      go:
        package: vocabdb
        out: internal/vocab/vocabdb
        sql_package: pgx/v5
