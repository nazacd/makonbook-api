# Production stack for api.makonbook.uz — lives on the VPS at
# /opt/makonbook-api/docker-compose.yml. See deploy/DEPLOY.md.
#
# Two containers from one image:
#   makonbook-api         HTTP API (makonbook serve), reached by the edge
#                         nginx (makonbook-nginx) as http://makonbook-api:8080
#   makonbook-api-worker  HolliHop sync (makonbook worker)
#
# Postgres is the shared `db` container on sat_makon_network; this stack uses
# its own database and non-superuser role (makonbook_api). No host ports are
# published.
#
# One-off commands use the same image, e.g.:
#   docker compose run --rm api migrate up
#   docker compose run --rm api sync full
#   docker compose run --rm api reset-password student 1234

name: makonbook-api

x-common: &common
  image: ${API_IMAGE:-nazacd/makonbook-api:latest}
  pull_policy: always
  restart: always
  env_file: .env
  environment:
    APP_ENV: production
    HTTP_ADDR: ":8080"
    TRUST_PROXY: "true" # behind makonbook-nginx, which sets X-Forwarded-For
  networks:
    - sat_makon_network
  read_only: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *common
    container_name: makonbook-api
    command: ["serve"]
    expose:
      - "8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/makonbook", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *common
    container_name: makonbook-api-worker
    command: ["worker"]
    mem_limit: 256m

networks:
  sat_makon_network:
    external: true
