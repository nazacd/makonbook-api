# admin.makonbook.uz — the admin panel; add to the edge nginx config
# (/opt/sat-makon/makonbook/nginx/default.conf), like nginx-api.conf.
#
# The API container serves both the panel and /v1/admin/* on this host
# (ADMIN_HOST in .env), so page and API share one origin: the sign-in cookie
# stays first-party and no CORS is needed. Same two-part order as the API
# block (DEPLOY.md "Admin panel"): PART 1, certificate, then PART 2.

# ---- PART 1: HTTP — ACME challenge for the certificate, redirect the rest ----
server {
    listen 80;
    server_name admin.makonbook.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- PART 2: HTTPS -> makonbook-api:8080 ----
server {
    listen 443 ssl;
    server_name admin.makonbook.uz;

    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/admin.makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Browsers use HTTPS only for this host from now on (the cookie is Secure).
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=30s;
    set $makonbook_api http://makonbook-api:8080;

    location / {
        proxy_pass $makonbook_api;
        proxy_http_version 1.1;
        # The API picks the panel by this Host header (ADMIN_HOST).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
