# api.makonbook.uz — add to the edge nginx config
# (/opt/sat-makon/makonbook/nginx/default.conf, mounted into makonbook-nginx).
#
# Two parts, added in order (DEPLOY.md step 4):
#   PART 1 first, reload nginx, issue the certificate;
#   PART 2 only after the certificate exists — nginx refuses to load a server
#   block whose certificate file is missing, and that would take every site
#   on this edge down with it.

# ---- PART 1: HTTP — ACME challenge for the certificate, redirect the rest ----
server {
    listen 80;
    server_name api.makonbook.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- PART 2: HTTPS -> makonbook-api:8080 ----
server {
    listen 443 ssl;
    server_name api.makonbook.uz;

    # The API takes small JSON bodies only.
    client_max_body_size 1m;

    # Own certificate lineage, separate from the makonbook.uz SAN cert, so
    # issuing it can't disturb the other sites.
    ssl_certificate /etc/letsencrypt/live/api.makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Variable upstream, as in the other blocks: resolved per request, so
    # nginx still starts (and the other sites stay up) if the API is down.
    resolver 127.0.0.11 valid=30s;
    set $makonbook_api http://makonbook-api:8080;

    location / {
        proxy_pass $makonbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API reads the LAST X-Forwarded-For entry (the one nginx appends)
        # for its per-IP login limit; TRUST_PROXY=true in docker-compose.yml.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
